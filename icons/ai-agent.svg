<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="56" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.4"/>

  <!-- Head / brain shape -->
  <circle cx="60" cy="50" r="28" fill="url(#headGrad)" />

  <!-- Neural circuit lines inside head -->
  <circle cx="52" cy="42" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="68" cy="42" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="60" cy="52" r="3.5" fill="#fff" opacity="0.95"/>
  <circle cx="46" cy="54" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="74" cy="54" r="2.5" fill="#fff" opacity="0.7"/>

  <!-- Neural connections -->
  <line x1="52" y1="42" x2="60" y2="52" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="68" y1="42" x2="60" y2="52" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="46" y1="54" x2="52" y2="42" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  <line x1="74" y1="54" x2="68" y2="42" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  <line x1="46" y1="54" x2="60" y2="52" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  <line x1="74" y1="54" x2="60" y2="52" stroke="#fff" stroke-width="1.2" opacity="0.4"/>

  <!-- Antenna / signal -->
  <line x1="60" y1="22" x2="60" y2="12" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="10" r="3.5" fill="#7C3AED"/>
  <circle cx="60" cy="10" r="6" stroke="#7C3AED" stroke-width="1" opacity="0.3" fill="none"/>
  <circle cx="60" cy="10" r="10" stroke="#7C3AED" stroke-width="0.8" opacity="0.15" fill="none"/>

  <!-- Body / torso -->
  <path d="M44 76 Q44 68 52 66 L60 78 L68 66 Q76 68 76 76 L76 88 Q76 92 72 92 L48 92 Q44 92 44 88 Z" fill="url(#bodyGrad)"/>

  <!-- Chest light -->
  <circle cx="60" cy="82" r="4" fill="#10b981" opacity="0.9"/>
  <circle cx="60" cy="82" r="7" stroke="#10b981" stroke-width="1" opacity="0.3" fill="none"/>

  <!-- Arms reaching out -->
  <path d="M44 76 Q36 78 30 86" stroke="url(#armGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="28" cy="88" r="4" fill="#7C3AED" opacity="0.8"/>
  <path d="M76 76 Q84 78 90 86" stroke="url(#armGrad2)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="88" r="4" fill="#7C3AED" opacity="0.8"/>

  <!-- Floating data particles -->
  <circle cx="22" cy="82" r="1.5" fill="#10b981" opacity="0.6"/>
  <circle cx="98" cy="82" r="1.5" fill="#10b981" opacity="0.6"/>
  <circle cx="26" cy="74" r="1" fill="#818cf8" opacity="0.5"/>
  <circle cx="94" cy="74" r="1" fill="#818cf8" opacity="0.5"/>
  <circle cx="20" cy="92" r="1" fill="#818cf8" opacity="0.4"/>
  <circle cx="100" cy="92" r="1" fill="#818cf8" opacity="0.4"/>

  <!-- Base / feet -->
  <rect x="42" y="92" width="36" height="5" rx="2.5" fill="#4338ca" opacity="0.6"/>
  <rect x="38" y="97" width="44" height="4" rx="2" fill="#4338ca" opacity="0.35"/>

  <defs>
    <linearGradient id="headGrad" x1="32" y1="22" x2="88" y2="78">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="44" y1="66" x2="76" y2="92">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="44" y1="76" x2="30" y2="86">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="armGrad2" x1="76" y1="76" x2="90" y2="86">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Clipboard body -->
  <rect x="24" y="20" width="72" height="88" rx="8" fill="url(#clipGrad)" />
  <rect x="24" y="20" width="72" height="88" rx="8" stroke="#4338ca" stroke-width="1.5" opacity="0.3" fill="none"/>

  <!-- Clipboard top clip -->
  <rect x="42" y="14" width="36" height="16" rx="4" fill="#4338ca"/>
  <rect x="50" y="12" width="20" height="8" rx="4" fill="#6366f1"/>

  <!-- Task lines with checkboxes -->
  <!-- Task 1 - completed -->
  <rect x="34" y="40" width="14" height="14" rx="3" fill="#10b981"/>
  <path d="M37.5 47.5 L40 50 L47 43" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="42" width="34" height="4" rx="2" fill="#c7d2fe" opacity="0.7"/>
  <rect x="54" y="49" width="22" height="3" rx="1.5" fill="#c7d2fe" opacity="0.4"/>

  <!-- Task 2 - completed -->
  <rect x="34" y="60" width="14" height="14" rx="3" fill="#10b981"/>
  <path d="M37.5 67.5 L40 70 L47 63" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="62" width="30" height="4" rx="2" fill="#c7d2fe" opacity="0.7"/>
  <rect x="54" y="69" width="26" height="3" rx="1.5" fill="#c7d2fe" opacity="0.4"/>

  <!-- Task 3 - in progress (AI sparkle) -->
  <rect x="34" y="80" width="14" height="14" rx="3" fill="#818cf8" opacity="0.3" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="54" y="82" width="28" height="4" rx="2" fill="#c7d2fe" opacity="0.5"/>
  <rect x="54" y="89" width="18" height="3" rx="1.5" fill="#c7d2fe" opacity="0.3"/>

  <!-- AI brain badge (bottom right corner) -->
  <circle cx="92" cy="92" r="20" fill="url(#brainGrad)"/>
  <circle cx="92" cy="92" r="20" stroke="#7C3AED" stroke-width="1.5" opacity="0.4" fill="none"/>

  <!-- Brain neural dots -->
  <circle cx="86" cy="86" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="98" cy="86" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="92" cy="94" r="3" fill="#fff" opacity="0.95"/>
  <circle cx="84" cy="96" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="96" r="2" fill="#fff" opacity="0.6"/>

  <!-- Brain neural connections -->
  <line x1="86" y1="86" x2="92" y2="94" stroke="#fff" stroke-width="1.3" opacity="0.5"/>
  <line x1="98" y1="86" x2="92" y2="94" stroke="#fff" stroke-width="1.3" opacity="0.5"/>
  <line x1="84" y1="96" x2="92" y2="94" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <line x1="100" y1="96" x2="92" y2="94" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <line x1="86" y1="86" x2="98" y2="86" stroke="#fff" stroke-width="1" opacity="0.3"/>

  <!-- Sparkle particles around AI badge -->
  <circle cx="78" cy="78" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="106" cy="80" r="1.2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="104" cy="106" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="80" cy="104" r="1.3" fill="#fbbf24" opacity="0.6"/>

  <!-- Lightning bolt on in-progress task -->
  <path d="M39 82 L42 86 L40 87 L43 92 L38 88 L40 87 L37 83 Z" fill="#fbbf24"/>

  <defs>
    <linearGradient id="clipGrad" x1="24" y1="20" x2="96" y2="108">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="72" y1="72" x2="112" y2="112">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
</svg>

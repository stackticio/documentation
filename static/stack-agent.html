<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacktic LiveView</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10" fill="#666" stroke="none"/>
            </marker>
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10" fill="#10b981" stroke="none"/>
            </marker>
            
            <filter id="shadow">
                <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Stacktic SaaS UI -->
        <g transform="translate(50, 100)">
            <!-- Browser Window -->
            <rect x="0" y="0" width="200" height="140" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
            
            <!-- Browser Header -->
            <rect x="0" y="0" width="200" height="25" rx="6 6 0 0" fill="#f3f4f6"/>
            <circle cx="12" cy="12" r="3" fill="#ef4444"/>
            <circle cx="24" cy="12" r="3" fill="#fbbf24"/>
            <circle cx="36" cy="12" r="3" fill="#10b981"/>
            
            <!-- Minimal UI -->
            <!-- Sidebar -->
            <rect x="8" y="33" width="40" height="98" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
            
            <!-- Canvas with nodes -->
            <rect x="56" y="33" width="136" height="98" fill="#fafafa"/>
            
            <!-- Simple topology -->
            <circle cx="90" cy="60" r="6" fill="#6366f1"/>
            <circle cx="120" cy="60" r="6" fill="#f59e0b"/>
            <circle cx="150" cy="60" r="6" fill="#ec4899"/>
            <circle cx="90" cy="90" r="6" fill="#10b981"/>
            <circle cx="120" cy="90" r="6" fill="#3b82f6"/>
            <circle cx="150" cy="90" r="6" fill="#8b5cf6"/>
            
            <!-- Connections -->
            <line x1="96" y1="60" x2="114" y2="60" stroke="#d1d5db" stroke-width="1"/>
            <line x1="126" y1="60" x2="144" y2="60" stroke="#d1d5db" stroke-width="1"/>
            <line x1="90" y1="66" x2="90" y2="84" stroke="#d1d5db" stroke-width="1"/>
            <line x1="120" y1="66" x2="120" y2="84" stroke="#d1d5db" stroke-width="1"/>
            <line x1="150" y1="66" x2="150" y2="84" stroke="#d1d5db" stroke-width="1"/>
        </g>
        <text x="150" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Stacktic</text>

        <!-- Arrow: Generate -->
        <path d="M 250 170 L 350 170" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
        <text x="300" y="160" font-size="11" fill="#6b7280" text-anchor="middle">Generate</text>

        <!-- Git -->
        <g transform="translate(350, 130)">
            <circle cx="40" cy="40" r="35" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>
            <!-- GitHub icon -->
            <path d="M 40 20 C 30 20 22 28 22 38 C 22 46 26 53 32 55 C 33 55 33 54 33 53 V 50 C 28 51 27 48 27 48 C 26 46 25 46 25 46 C 23 44 25 44 25 44 C 27 44 28 46 28 46 C 30 49 33 48 34 47 C 34 46 35 45 35 45 C 31 44 27 43 27 36 C 27 34 28 32 29 31 C 29 31 27 29 29 26 C 29 26 31 26 34 28 C 35 27 38 27 40 27 C 42 27 45 27 46 28 C 49 26 51 26 51 26 C 53 29 51 31 51 31 C 52 32 53 34 53 36 C 53 43 49 44 45 45 C 46 46 46 47 46 49 V 53 C 46 54 47 55 47 55 C 53 53 58 46 58 38 C 58 28 50 20 40 20 Z" 
                  fill="#24292e"/>
        </g>
        <text x="390" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Repository</text>

        <!-- Arrow: Deploy -->
        <path d="M 430 170 L 550 170" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
        <text x="490" y="160" font-size="11" fill="#6b7280" text-anchor="middle">Deploy</text>

        <!-- K8s Cluster -->
        <rect x="550" y="100" width="250" height="140" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)"/>
        <text x="675" y="125" font-size="14" fill="#0ea5e9" text-anchor="middle">Kubernetes Cluster</text>
        
        <!-- Agent Bar -->
        <rect x="570" y="150" width="210" height="35" rx="6" fill="#10b981"/>
        <text x="675" y="172" font-size="13" fill="white" text-anchor="middle" font-weight="500">LiveView Agent</text>
        
        <!-- Workloads -->
        <g transform="translate(580, 195)">
            <rect x="0" y="0" width="30" height="20" rx="3" fill="#e0f2fe"/>
            <rect x="35" y="0" width="30" height="20" rx="3" fill="#fef3c7"/>
            <rect x="70" y="0" width="30" height="20" rx="3" fill="#fce7f3"/>
            <rect x="105" y="0" width="30" height="20" rx="3" fill="#e9d5ff"/>
            <rect x="140" y="0" width="30" height="20" rx="3" fill="#dbeafe"/>
            <rect x="175" y="0" width="30" height="20" rx="3" fill="#dcfce7"/>
        </g>

        <!-- Feedback Arrow with text on arrow -->
        <path d="M 675 240 L 675 320 L 150 320 L 150 240" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
        
        <!-- Text along the arrow path -->
        <text x="420" y="315" font-size="11" fill="#10b981" text-anchor="middle">
            Relationships • Security • Data Flow • Performance • Root Cause
        </text>

    </svg>
</body>
</html>

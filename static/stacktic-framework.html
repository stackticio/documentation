<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacktic Framework</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        svg {
            width: 100%;
            max-width: 1500px;
            height: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 1500 750" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Shadows -->
            <filter id="shadow">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
            </filter>
            
            <filter id="lightShadow">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
            </filter>
            
            <!-- Arrow markers -->
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" 
                    markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10" fill="#4b5563" stroke="none"/>
            </marker>

            <marker id="arrowDashed" viewBox="0 0 10 10" refX="10" refY="5" 
                    markerWidth="7" markerHeight="7" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10" fill="#9ca3af" stroke="none"/>
            </marker>
        </defs>

        <!-- SQUARE STACKTIC UI -->
        <g id="stacktic-ui">
            <!-- Main UI container - proper square -->
            <rect x="625" y="10" width="250" height="180" rx="10" fill="#1e293b" filter="url(#shadow)"/>
            
            <!-- Header -->
            <rect x="625" y="10" width="250" height="28" rx="10 10 0 0" fill="#0f172a"/>
            <text x="642" y="28" font-size="14" fill="#818cf8" font-weight="bold">STACKTIC</text>
            
            <!-- Window controls -->
            <circle cx="835" cy="24" r="4" fill="#ef4444"/>
            <circle cx="848" cy="24" r="4" fill="#fbbf24"/>
            <circle cx="861" cy="24" r="4" fill="#10b981"/>
            
            <!-- Main UI content area -->
            <g transform="translate(635, 45)">
                <!-- Service grid panel -->
                <rect x="0" y="0" width="110" height="60" rx="5" fill="#334155" opacity="0.6"/>
                <g transform="translate(8, 8)">
                    <!-- Service blocks -->
                    <rect x="0" y="0" width="20" height="20" rx="3" fill="#4338ca"/>
                    <rect x="24" y="0" width="20" height="20" rx="3" fill="#059669"/>
                    <rect x="48" y="0" width="20" height="20" rx="3" fill="#dc2626"/>
                    <rect x="72" y="0" width="20" height="20" rx="3" fill="#0891b2"/>
                    
                    <rect x="0" y="24" width="20" height="20" rx="3" fill="#7c3aed"/>
                    <rect x="24" y="24" width="20" height="20" rx="3" fill="#ea580c"/>
                    <rect x="48" y="24" width="20" height="20" rx="3" fill="#fbbf24"/>
                    <rect x="72" y="24" width="20" height="20" rx="3" fill="#ec4899"/>
                </g>
                
                <!-- Architecture view -->
                <rect x="0" y="65" width="230" height="65" rx="5" fill="#1e293b"/>
                <g transform="translate(15, 75)">
                    <!-- Node network -->
                    <line x1="20" y1="20" x2="60" y2="20" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    <line x1="60" y1="20" x2="100" y2="20" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    <line x1="100" y1="20" x2="140" y2="20" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    <line x1="140" y1="20" x2="180" y2="20" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    
                    <circle cx="20" cy="20" r="8" fill="#4338ca"/>
                    <circle cx="60" cy="20" r="8" fill="#059669"/>
                    <circle cx="100" cy="20" r="10" fill="#818cf8" stroke="#fff" stroke-width="1.5"/>
                    <circle cx="140" cy="20" r="8" fill="#dc2626"/>
                    <circle cx="180" cy="20" r="8" fill="#7c3aed"/>
                    
                    <line x1="60" y1="20" x2="60" y2="40" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    <line x1="100" y1="20" x2="100" y2="40" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    <line x1="140" y1="20" x2="140" y2="40" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
                    
                    <circle cx="60" cy="40" r="6" fill="#0891b2"/>
                    <circle cx="100" cy="40" r="6" fill="#10b981"/>
                    <circle cx="140" cy="40" r="6" fill="#f59e0b"/>
                </g>
                
                <!-- Status panel -->
                <rect x="120" y="0" width="110" height="60" rx="5" fill="#334155" opacity="0.6"/>
                <g transform="translate(125, 8)">
                    <rect x="0" y="0" width="100" height="6" rx="3" fill="#1e293b"/>
                    <rect x="0" y="0" width="70" height="6" rx="3" fill="#10b981"/>
                    
                    <rect x="0" y="10" width="100" height="6" rx="3" fill="#1e293b"/>
                    <rect x="0" y="10" width="85" height="6" rx="3" fill="#818cf8"/>
                    
                    <rect x="0" y="20" width="100" height="6" rx="3" fill="#1e293b"/>
                    <rect x="0" y="20" width="75" height="6" rx="3" fill="#06b6d4"/>
                    
                    <rect x="0" y="30" width="100" height="6" rx="3" fill="#1e293b"/>
                    <rect x="0" y="30" width="90" height="6" rx="3" fill="#a78bfa"/>
                    
                    <circle cx="50" cy="46" r="4" fill="#10b981"/>
                    <text x="58" y="49" font-size="8" fill="#94a3b8">System Active</text>
                </g>
            </g>
        </g>

        <!-- BETTER DESIGNED ARROWS FROM STACKTIC UI TO THE 3 BUBBLES -->
        <!-- Using curved paths for more elegant connection -->
        <!-- Left arrow to Integration -->
        <path d="M 690 190 Q 550 240 400 290" 
              stroke="#9ca3af" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" opacity="0.6"/>
        
        <!-- Center arrow to Relationships -->
        <path d="M 750 190 L 750 290" 
              stroke="#9ca3af" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" opacity="0.6"/>
        
        <!-- Right arrow to Full Stack -->
        <path d="M 810 190 Q 950 240 1100 290" 
              stroke="#9ca3af" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" opacity="0.6"/>

        <!-- Main dashed container -->
        <rect x="220" y="320" width="1060" height="320" rx="12" 
              fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="12,6" opacity="0.5"/>

        <!-- ========== TOP THREE BUBBLES ========== -->
        
        <!-- BUBBLE 1: INTEGRATION -->
        <g id="integration-bubble">
            <rect x="250" y="290" width="300" height="160" rx="12" fill="#4338ca" filter="url(#shadow)"/>
            <text x="400" y="315" font-size="14" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1">
                INTEGRATION
            </text>
            
            <!-- Icons and labels -->
            <g transform="translate(270, 335)">
                <!-- Row 1 -->
                <rect x="0" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="30" y="18" font-size="20" text-anchor="middle">&lt;/&gt;</text>
                <text x="30" y="33" font-size="9" fill="white" text-anchor="middle">Source Code</text>
                
                <rect x="70" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="100" y="18" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Git</text>
                <text x="100" y="33" font-size="9" fill="white" text-anchor="middle">Version</text>
                
                <rect x="140" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="170" y="18" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">Py</text>
                <text x="170" y="33" font-size="9" fill="white" text-anchor="middle">Python</text>
                
                <rect x="210" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="240" y="18" font-size="14" fill="white" text-anchor="middle" font-weight="bold">API</text>
                <text x="240" y="33" font-size="9" fill="white" text-anchor="middle">Services</text>
                
                <!-- Row 2 -->
                <rect x="0" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="30" y="68" font-size="14" fill="white" text-anchor="middle" font-weight="bold">React</text>
                <text x="30" y="83" font-size="9" fill="white" text-anchor="middle">Framework</text>
                
                <rect x="70" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="100" y="68" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Helm</text>
                <text x="100" y="83" font-size="9" fill="white" text-anchor="middle">K8s Deploy</text>
                
                <rect x="140" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="170" y="68" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Docker</text>
                <text x="170" y="83" font-size="9" fill="white" text-anchor="middle">Container</text>
                
                <rect x="210" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="240" y="68" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Ollama</text>
                <text x="240" y="83" font-size="9" fill="white" text-anchor="middle">LLM</text>
            </g>
        </g>

        <!-- BUBBLE 2: RELATIONSHIPS -->
        <g id="relationships-bubble">
            <rect x="600" y="290" width="300" height="160" rx="12" fill="#059669" filter="url(#shadow)"/>
            <text x="750" y="315" font-size="14" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1">
                RELATIONSHIPS
            </text>
            
            <!-- Icons with tech labels -->
            <g transform="translate(620, 335)">
                <!-- Row 1: Messaging systems with icons -->
                <rect x="0" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="30" y="18" font-size="14" fill="#ff9800" text-anchor="middle" font-weight="bold">K</text>
                <text x="30" y="33" font-size="9" fill="white" text-anchor="middle">Kafka</text>
                
                <rect x="70" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="100" y="18" font-size="14" fill="#ff6b35" text-anchor="middle" font-weight="bold">RMQ</text>
                <text x="100" y="33" font-size="9" fill="white" text-anchor="middle">RabbitMQ</text>
                
                <rect x="140" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="170" y="18" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">✨</text>
                <text x="170" y="33" font-size="9" fill="white" text-anchor="middle">Spark</text>
                
                <rect x="210" y="0" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="240" y="18" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">F</text>
                <text x="240" y="33" font-size="9" fill="white" text-anchor="middle">Flink</text>
                
                <!-- Row 2: Data systems with icons -->
                <rect x="0" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="30" y="68" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">🍃</text>
                <text x="30" y="83" font-size="9" fill="white" text-anchor="middle">MongoDB</text>
                
                <rect x="70" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="100" y="68" font-size="14" fill="#0ea5e9" text-anchor="middle" font-weight="bold">🐘</text>
                <text x="100" y="83" font-size="9" fill="white" text-anchor="middle">PostgreSQL</text>
                
                <rect x="140" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="170" y="68" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">R</text>
                <text x="170" y="83" font-size="9" fill="white" text-anchor="middle">Redis</text>
                
                <rect x="210" y="50" width="60" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
                <text x="240" y="68" font-size="14" fill="#06b6d4" text-anchor="middle" font-weight="bold">🌊</text>
                <text x="240" y="83" font-size="9" fill="white" text-anchor="middle">Airflow</text>
            </g>
        </g>

        <!-- BUBBLE 3: FULL STACK -->
        <g id="fullstack-bubble">
            <rect x="950" y="290" width="300" height="160" rx="12" fill="#7c3aed" filter="url(#shadow)"/>
            <text x="1100" y="315" font-size="14" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1">
                FULL STACK
            </text>
            
            <!-- Stack layers -->
            <g transform="translate(975, 335)">
                <rect x="0" y="0" width="250" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
                <text x="125" y="9" font-size="9" fill="#333" text-anchor="middle" font-weight="500">Stack Topology</text>
                
                <rect x="0" y="14" width="250" height="12" rx="2" fill="rgba(255,255,255,0.8)"/>
                <text x="125" y="23" font-size="9" fill="#333" text-anchor="middle" font-weight="500">Data Pipelines</text>
                
                <rect x="0" y="28" width="250" height="12" rx="2" fill="rgba(255,255,255,0.7)"/>
                <text x="125" y="37" font-size="9" fill="#333" text-anchor="middle" font-weight="500">Observability</text>
                
                <rect x="0" y="42" width="250" height="12" rx="2" fill="rgba(255,255,255,0.6)"/>
                <text x="125" y="51" font-size="9" fill="#333" text-anchor="middle" font-weight="500">Ops Ready</text>
                
                <rect x="0" y="56" width="250" height="12" rx="2" fill="rgba(255,255,255,0.5)"/>
                <text x="125" y="65" font-size="9" fill="#333" text-anchor="middle" font-weight="500">SecOps Compliant</text>
                
                <rect x="0" y="70" width="250" height="12" rx="2" fill="rgba(255,255,255,0.4)"/>
                <text x="125" y="79" font-size="9" fill="#333" text-anchor="middle" font-weight="500">Versioning</text>
                
                <rect x="0" y="84" width="250" height="12" rx="2" fill="rgba(255,255,255,0.3)"/>
                <text x="125" y="93" font-size="9" fill="#333" text-anchor="middle" font-weight="500">CI/CD Ready</text>
            </g>
        </g>

        <!-- ========== INPUT SOURCES (LEFT) ========== -->
        <g id="input-sources">
            <!-- Tool/Service -->
            <rect x="40" y="490" width="140" height="40" rx="20" fill="#374151" filter="url(#shadow)"/>
            <text x="110" y="515" font-size="13" fill="white" text-anchor="middle" font-weight="500">Tool / Service</text>

            <!-- Package/Code (aligned with Integrate center) -->
            <rect x="40" y="550" width="140" height="40" rx="20" fill="#374151" filter="url(#shadow)"/>
            <text x="110" y="575" font-size="13" fill="white" text-anchor="middle" font-weight="500">Package / Code</text>

            <!-- Open Source -->
            <rect x="40" y="610" width="140" height="40" rx="20" fill="#374151" filter="url(#shadow)"/>
            <text x="110" y="635" font-size="13" fill="white" text-anchor="middle" font-weight="500">Open Source</text>
        </g>

        <!-- ========== MAIN PROCESS FLOW (MORE SPACE FROM BUBBLES) ========== -->

        <!-- Integrate -->
        <rect x="300" y="550" width="120" height="40" rx="20" fill="#059669" filter="url(#shadow)"/>
        <text x="360" y="575" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Integrate</text>

        <!-- Build metadata (ON SAME LAYER AS TRANSLATE, BETWEEN INTEGRATE AND ASSEMBLE) -->
        <rect x="430" y="480" width="120" height="35" rx="17" fill="white" stroke="#059669" stroke-width="2"/>
        <text x="490" y="502" font-size="13" fill="#059669" text-anchor="middle" font-weight="500">Build metadata</text>

        <!-- Assemble -->
        <rect x="560" y="550" width="120" height="40" rx="20" fill="#059669" filter="url(#shadow)"/>
        <text x="620" y="575" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Assemble</text>

        <!-- AI Icon -->
        <g id="ai-icon">
            <circle cx="750" cy="490" r="25" fill="white" stroke="#6b7280" stroke-width="2"/>
            <text x="750" y="497" font-size="16" fill="#374151" text-anchor="middle" font-weight="bold">AI</text>
        </g>

        <!-- Translate (MOVED UP FOR BETTER SPACING) -->
        <rect x="800" y="480" width="140" height="35" rx="17" fill="white" stroke="#059669" stroke-width="2"/>
        <text x="870" y="502" font-size="13" fill="#059669" text-anchor="middle" font-weight="500">Translate</text>

        <!-- Automate -->
        <rect x="820" y="550" width="120" height="40" rx="20" fill="#059669" filter="url(#shadow)"/>
        <text x="880" y="575" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Automate</text>

        <!-- Full-stack operational -->
        <rect x="1080" y="550" width="180" height="40" rx="20" fill="#059669" filter="url(#shadow)"/>
        <text x="1170" y="575" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Full-stack operational</text>

        <!-- Suggest/Alert boxes -->
        <rect x="590" y="630" width="80" height="35" rx="17" fill="#374151" filter="url(#lightShadow)"/>
        <text x="630" y="652" font-size="13" fill="white" text-anchor="middle" font-weight="500">Suggest</text>

        <rect x="690" y="630" width="80" height="35" rx="17" fill="#374151" filter="url(#lightShadow)"/>
        <text x="730" y="652" font-size="13" fill="white" text-anchor="middle" font-weight="500">Alert</text>

        <!-- People icons -->
        <g transform="translate(680, 700)">
            <circle cx="-30" cy="0" r="18" fill="#374151"/>
            <text x="-30" y="5" font-size="18" text-anchor="middle">👤</text>

            <circle cx="0" cy="0" r="18" fill="#374151"/>
            <text x="0" y="5" font-size="18" text-anchor="middle">👥</text>

            <circle cx="30" cy="0" r="18" fill="#374151"/>
            <text x="30" y="5" font-size="18" text-anchor="middle">👤</text>
        </g>

        <!-- ========== ARROWS (ADJUSTED FOR NEW POSITIONS) ========== -->

        <!-- Input arrows to Integrate (symmetric) -->
        <path d="M 180 510 L 300 560" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
        <path d="M 180 570 L 300 570" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
        <path d="M 180 630 L 300 580" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

        <!-- Top bubbles to process flow (MORE SPACE) -->
        <line x1="400" y1="450" x2="400" y2="550"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
        <line x1="750" y1="450" x2="620" y2="550"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
        <line x1="1100" y1="450" x2="880" y2="550"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>

        <!-- Main horizontal flow -->
        <path d="M 420 570 L 560 570" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
        <path d="M 680 570 L 820 570" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
        <path d="M 940 570 L 1080 570" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

        <!-- Build metadata arrows to Integrate and Assemble (vertical arrows going down) -->
        <line x1="450" y1="515" x2="380" y2="550"
              stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="530" y1="515" x2="600" y2="550"
              stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Translate to Automate ONLY -->
        <line x1="870" y1="515" x2="870" y2="550"
              stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- AI to Suggest/Alert -->
        <line x1="725" y1="515" x2="630" y2="630"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
        <line x1="775" y1="515" x2="730" y2="630"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>

        <!-- Suggest/Alert to People -->
        <line x1="630" y1="665" x2="650" y2="682"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
        <line x1="730" y1="665" x2="710" y2="682"
              stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>

    </svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance Automation</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Fira Code', monospace; background: #060612; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0, frame = 0, vis = true;
  var FPS = 60;

  function sec(s) { return s * FPS; }
  function ease(startSec, durSec) {
    var t = (frame - sec(startSec)) / sec(durSec);
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.pow(1 - t, 3);
  }

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var cyan = '#22d3ee', green = '#34d399', yellow = '#fbbf24', purple = '#a78bfa';
  var indigo = '#818cf8', red = '#f87171', white = '#e2e8f0', dim = '#94a3b8';

  function roundRect(x,y,w,h,r) {
    if (w<1||h<1) return;
    r = Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }
  function fs(ratio) { return Math.max(8, Math.min(ratio * W, 36)); }

  function resize() {
    W = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0, 800);
    H = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0, 600);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() { vis = !document.hidden; if (vis) animate(); });

  // ── Compliance frameworks ──
  var frameworks = [
    {
      name: 'PCI-DSS', pct: 78, color: '#f59e0b', accent: yellow,
      sub: 'Payment Card Industry',
      checks: ['Network Segmentation', 'Access Control (RBAC)', 'Encryption at Rest', 'Vulnerability Scanning', 'Audit Logging', 'Secrets Management'],
      passed: [true, true, true, true, false, true]
    },
    {
      name: 'HIPAA', pct: 88, color: '#10b981', accent: green,
      sub: 'Health Insurance Portability',
      checks: ['Data Encryption', 'Access Controls', 'Audit Trails', 'Integrity Controls', 'Transmission Security', 'Contingency Plan'],
      passed: [true, true, true, true, true, false]
    },
    {
      name: 'ISO 27001', pct: 95, color: '#22d3ee', accent: cyan,
      sub: 'Information Security Mgmt',
      checks: ['Risk Assessment', 'Access Control Policy', 'Cryptography', 'Operations Security', 'Communications Sec', 'Compliance Monitoring'],
      passed: [true, true, true, true, true, true]
    },
    {
      name: 'DORA', pct: 72, color: '#a78bfa', accent: purple,
      sub: 'Digital Operational Resilience',
      checks: ['ICT Risk Management', 'Incident Reporting', 'Resilience Testing', 'Third-party Risk', 'Info Sharing', 'Threat Detection'],
      passed: [true, true, false, true, false, true]
    }
  ];

  // ── Stacktic security layers feeding compliance ──
  var secLayers = [
    { name: 'OPA', color: indigo },
    { name: 'RBAC', color: green },
    { name: 'NetPol', color: cyan },
    { name: 'SOPS', color: yellow },
    { name: 'CVE', color: red },
    { name: 'mTLS', color: purple }
  ];

  // Timeline
  var TITLE_START = 0.0;
  var SHIELD_START = 0.5;
  var SEC_START = 1.5;    // security layers appear
  var GAUGE_STARTS = [3.0, 4.0, 5.0, 6.0]; // each framework
  var CHECK_START = 7.5;  // checklists animate in

  // Particles
  var particles = [];
  for (var i = 0; i < 40; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      s: 0.5 + Math.random() * 2,
      ph: Math.random() * Math.PI * 2,
      vy: -0.0003 - Math.random() * 0.0005,
      vx: (Math.random() - 0.5) * 0.0002,
      color: [cyan, green, yellow, purple, indigo][Math.floor(Math.random() * 5)]
    });
  }

  function drawShield(cx, cy, size, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size * 0.5);
    ctx.quadraticCurveTo(cx + size * 0.45, cy - size * 0.42, cx + size * 0.45, cy - size * 0.08);
    ctx.quadraticCurveTo(cx + size * 0.4, cy + size * 0.25, cx, cy + size * 0.5);
    ctx.quadraticCurveTo(cx - size * 0.4, cy + size * 0.25, cx - size * 0.45, cy - size * 0.08);
    ctx.quadraticCurveTo(cx - size * 0.45, cy - size * 0.42, cx, cy - size * 0.5);
    ctx.closePath();
    ctx.strokeStyle = rgba(cyan, 0.4); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = rgba(indigo, 0.06); ctx.fill();
    // Check
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.12, cy + size * 0.02);
    ctx.lineTo(cx - size * 0.02, cy + size * 0.14);
    ctx.lineTo(cx + size * 0.15, cy - size * 0.08);
    ctx.strokeStyle = rgba(green, 0.5); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    frame++;
    var cx = W / 2, cy = H / 2;

    // ── Background ──
    var vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    vig.addColorStop(0, '#0e0d25');
    vig.addColorStop(0.5, '#080818');
    vig.addColorStop(1, '#030306');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Grid dots
    ctx.fillStyle = rgba(indigo, 0.06);
    for (var dx = 20; dx < W; dx += 45) {
      for (var dy = 20; dy < H; dy += 45) {
        ctx.beginPath(); ctx.arc(dx, dy, 0.8, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ── Particles ──
    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -0.03) { p.y = 1.03; p.x = Math.random(); }
      var pa = 0.15 + Math.sin(frame * 0.015 + p.ph) * 0.08;
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.s, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.color, pa); ctx.fill();
    }

    // ════════════════════════
    //  TITLE
    // ════════════════════════
    var titleA = ease(TITLE_START, 1.0);
    if (titleA > 0) {
      ctx.save(); ctx.globalAlpha = titleA;
      ctx.font = '700 ' + fs(0.024) + 'px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var tg = ctx.createLinearGradient(W * 0.25, 0, W * 0.75, 0);
      tg.addColorStop(0, yellow); tg.addColorStop(0.3, green); tg.addColorStop(0.6, cyan); tg.addColorStop(1, purple);
      ctx.fillStyle = tg;
      ctx.fillText('Compliance Automation', cx, H * 0.06);

      ctx.font = '400 ' + fs(0.008) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(dim, 0.5);
      ctx.fillText('Automated policy enforcement from infrastructure to audit', cx, H * 0.10);
      ctx.restore();
    }

    // ════════════════════════
    //  CENTRAL SHIELD
    // ════════════════════════
    var shieldA = ease(SHIELD_START, 1.0);
    if (shieldA > 0) {
      var shieldSize = Math.min(W, H) * 0.08;
      var shieldPulse = 0.25 + Math.sin(frame * 0.015) * 0.08;
      drawShield(cx, H * 0.28, shieldSize, shieldPulse * shieldA);
    }

    // ════════════════════════
    //  SECURITY LAYERS (feeding into compliance, top center)
    // ════════════════════════
    var secA = ease(SEC_START, 0.8);
    if (secA > 0) {
      var secTotalW = secLayers.length * 75;
      var secStartX = cx - secTotalW / 2;
      var secY = H * 0.20;

      ctx.save(); ctx.globalAlpha = secA * 0.6;
      ctx.font = '600 ' + fs(0.007) + 'px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(dim, 0.4);
      ctx.fillText('STACKTIC SECURITY LAYERS', cx, secY - 18);
      ctx.restore();

      for (var si = 0; si < secLayers.length; si++) {
        var sl = secLayers[si];
        var sA = ease(SEC_START + si * 0.12, 0.4);
        if (sA <= 0) continue;

        var sx = secStartX + si * 75 + 37.5;
        var pulse = 0.6 + Math.sin(frame * 0.02 + si * 1.2) * 0.15;

        ctx.save(); ctx.globalAlpha = sA * 0.55;

        // Pill
        roundRect(sx - 30, secY - 11, 60, 22, 11);
        ctx.fillStyle = rgba(sl.color, 0.08 * pulse); ctx.fill();
        ctx.strokeStyle = rgba(sl.color, 0.35 * pulse); ctx.lineWidth = 1; ctx.stroke();

        ctx.font = '600 ' + fs(0.007) + 'px "Fira Code", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(sl.color, 0.8);
        ctx.fillText(sl.name, sx, secY);

        ctx.restore();

        // Dashed lines down to gauge area
        if (sA >= 1) {
          ctx.save();
          ctx.globalAlpha = 0.08 + Math.sin(frame * 0.01 + si) * 0.03;
          ctx.beginPath();
          ctx.moveTo(sx, secY + 12);
          ctx.lineTo(sx, H * 0.37);
          ctx.strokeStyle = rgba(sl.color, 0.3);
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 6]); ctx.stroke(); ctx.setLineDash([]);

          // data packet
          var pktT = ((frame * 0.008 + si * 0.2) % 1);
          var pktY = secY + 12 + pktT * (H * 0.17);
          ctx.beginPath(); ctx.arc(sx, pktY, 2, 0, Math.PI * 2);
          ctx.fillStyle = rgba(sl.color, 0.4); ctx.fill();

          ctx.restore();
        }
      }
    }

    // ════════════════════════
    //  COMPLIANCE FRAMEWORK GAUGES
    // ════════════════════════
    var gaugeAreaY = H * 0.42;
    var gaugeR = Math.min(W * 0.055, H * 0.09, 55);
    var gaugeSpacing = W / (frameworks.length + 1);

    for (var fi = 0; fi < frameworks.length; fi++) {
      var fw = frameworks[fi];
      var gA = ease(GAUGE_STARTS[fi], 1.2);
      if (gA <= 0) continue;

      var gx = gaugeSpacing * (fi + 1);
      var gy = gaugeAreaY;

      ctx.save(); ctx.globalAlpha = gA;

      // Card background
      var cardW = gaugeR * 2.6;
      var cardH = gaugeR * 2.2 + 40;
      roundRect(gx - cardW/2, gy - gaugeR - 26, cardW, cardH, 14);
      ctx.fillStyle = rgba('#0f0e24', 0.6); ctx.fill();
      ctx.strokeStyle = rgba(fw.color, 0.12); ctx.lineWidth = 1; ctx.stroke();

      // Framework name above gauge
      ctx.font = '700 ' + fs(0.012) + 'px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(fw.color, 0.9);
      ctx.fillText(fw.name, gx, gy - gaugeR - 10);

      // Background ring
      ctx.beginPath();
      ctx.arc(gx, gy, gaugeR, -Math.PI * 0.5, Math.PI * 1.5);
      ctx.strokeStyle = rgba('#1e293b', 0.6);
      ctx.lineWidth = Math.max(6, gaugeR * 0.14);
      ctx.lineCap = 'round';
      ctx.stroke();

      // Progress ring
      var targetAngle = (fw.pct / 100) * Math.PI * 2;
      var currentAngle = targetAngle * gA;
      if (gA >= 1) {
        currentAngle = targetAngle + Math.sin(frame * 0.018 + fi * 2) * 0.015;
      }
      ctx.beginPath();
      ctx.arc(gx, gy, gaugeR, -Math.PI * 0.5, -Math.PI * 0.5 + currentAngle);
      ctx.strokeStyle = fw.color;
      ctx.lineWidth = Math.max(6, gaugeR * 0.14);
      ctx.lineCap = 'round';
      ctx.stroke();

      // Glowing tip
      if (gA > 0.3) {
        var tipA = -Math.PI * 0.5 + currentAngle;
        var tx = gx + Math.cos(tipA) * gaugeR;
        var ty = gy + Math.sin(tipA) * gaugeR;
        var tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 12);
        tg.addColorStop(0, rgba(fw.color, 0.5)); tg.addColorStop(1, 'transparent');
        ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
      }

      // Percentage
      var displayPct = Math.round(fw.pct * gA);
      ctx.font = '700 ' + fs(0.02) + 'px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = white;
      ctx.fillText(displayPct + '%', gx, gy - 2);

      // "automated" label
      ctx.font = '400 ' + fs(0.006) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(dim, 0.5);
      ctx.fillText('automated', gx, gy + 14);

      // Sub label
      ctx.font = '400 ' + fs(0.006) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(fw.color, 0.5);
      ctx.fillText(fw.sub, gx, gy + gaugeR + 18);

      ctx.restore();

      // ── Checklist below gauge ──
      var checkStartY = gy + gaugeR + 36;
      for (var ci = 0; ci < fw.checks.length; ci++) {
        var chkA = ease(CHECK_START + fi * 0.3 + ci * 0.08, 0.3);
        if (chkA <= 0) continue;

        var chkY = checkStartY + ci * 18;
        var passed = fw.passed[ci];

        ctx.save(); ctx.globalAlpha = chkA * 0.65;

        // Check/X icon
        ctx.font = '600 ' + fs(0.007) + 'px "Fira Code", monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        if (passed) {
          ctx.fillStyle = rgba(green, 0.8);
          ctx.fillText('\u2713', gx - cardW/2 + 10, chkY);
        } else {
          ctx.fillStyle = rgba(red, 0.6);
          ctx.fillText('\u2717', gx - cardW/2 + 10, chkY);
        }

        // Check label
        ctx.font = '400 ' + fs(0.0055) + 'px "Fira Code", monospace';
        ctx.fillStyle = passed ? rgba(dim, 0.7) : rgba(dim, 0.35);
        ctx.fillText(fw.checks[ci], gx - cardW/2 + 24, chkY);

        ctx.restore();
      }
    }

    // ════════════════════════
    //  CONNECTING FLOW: layers → gauges
    // ════════════════════════
    var flowA = ease(GAUGE_STARTS[0] + 0.5, 1.0);
    if (flowA > 0) {
      ctx.save(); ctx.globalAlpha = flowA * 0.1;
      // Horizontal line connecting all gauges
      var firstGX = gaugeSpacing;
      var lastGX = gaugeSpacing * frameworks.length;
      ctx.beginPath();
      ctx.moveTo(firstGX, gaugeAreaY - gaugeR - 30);
      ctx.lineTo(lastGX, gaugeAreaY - gaugeR - 30);
      ctx.strokeStyle = rgba(dim, 0.3);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }

    // ════════════════════════
    //  CORNER BRACKETS
    // ════════════════════════
    var brA = 0.2 + Math.sin(frame * 0.012) * 0.06;
    var brLen = 45, brOff = 18;
    ctx.strokeStyle = rgba(indigo, brA); ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(brOff, brOff+brLen); ctx.lineTo(brOff, brOff); ctx.lineTo(brOff+brLen, brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, brOff); ctx.lineTo(W-brOff, brOff); ctx.lineTo(W-brOff, brOff+brLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(brOff, H-brOff-brLen); ctx.lineTo(brOff, H-brOff); ctx.lineTo(brOff+brLen, H-brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, H-brOff); ctx.lineTo(W-brOff, H-brOff); ctx.lineTo(W-brOff, H-brOff-brLen); ctx.stroke();

    // ════════════════════════
    //  BOTTOM ANNOTATION
    // ════════════════════════
    var annA = ease(CHECK_START + 2, 1.0);
    if (annA > 0) {
      ctx.save(); ctx.globalAlpha = annA * 0.2;
      ctx.font = '400 ' + fs(0.007) + 'px "Fira Code", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = rgba(dim, 0.4);
      ctx.fillText('// automated compliance from stacktic security layers', 16, H - 10);
      ctx.textAlign = 'right';
      ctx.fillStyle = rgba(purple, 0.35);
      ctx.fillText('{ Stacktic }', W - 16, H - 10);
      ctx.restore();
    }
  }

  function animate() {
    if (!vis) return;
    draw();
    requestAnimationFrame(animate);
  }

  if (document.readyState === 'complete') { resize(); animate(); }
  else { window.addEventListener('load', function() { resize(); animate(); }); }
})();
</script>
</body>
</html>

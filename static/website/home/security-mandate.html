<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacktic — Zero-Touch Security</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Fira Code', monospace;
      background: #2A2847;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated background canvas */
    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Content overlay */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 1100px;
      padding: 60px 40px;
    }

    /* Year badge */
    .year-badge {
      display: inline-block;
      padding: 8px 28px;
      border: 2px solid rgba(251, 191, 36, 0.4);
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      color: #fbbf24;
      letter-spacing: 3px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.3s;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
    }

    /* Main headline */
    .headline {
      font-size: 62px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.6s;
    }
    .headline .zero-touch {
      background: linear-gradient(135deg, #34d399 0%, #60d5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .headline .automated-ops {
      background: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .headline .mandate {
      color: #ffffff;
      font-size: 48px;
      display: block;
      margin-top: 16px;
    }
    .headline .outpace {
      color: #fbbf24;
      text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
    }
    .headline .threats {
      background: linear-gradient(135deg, #f87171 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Divider */
    .divider {
      width: 120px;
      height: 3px;
      margin: 0 auto 40px;
      background: linear-gradient(90deg, #34d399, #60d5ff, #c084fc, #fbbf24);
      border-radius: 2px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.9s;
    }

    /* Pillars */
    .pillars {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 50px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.1s;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(139, 92, 246, 0.06);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .pill:hover {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.1);
      transform: translateY(-2px);
    }
    .pill-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill.security .pill-dot { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.5); }
    .pill.security { color: #34d399; }
    .pill.automation .pill-dot { background: #60d5ff; box-shadow: 0 0 8px rgba(96, 213, 255, 0.5); }
    .pill.automation { color: #60d5ff; }
    .pill.governance .pill-dot { background: #fbbf24; box-shadow: 0 0 8px rgba(251, 191, 36, 0.5); }
    .pill.governance { color: #fbbf24; }
    .pill.resilience .pill-dot { background: #c084fc; box-shadow: 0 0 8px rgba(192, 132, 252, 0.5); }
    .pill.resilience { color: #c084fc; }

    /* Terminal */
    .terminal {
      font-size: 15px;
      color: #34d399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.4s;
    }
    .cursor {
      display: inline-block;
      width: 8px; height: 15px;
      background: #34d399;
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Responsive */
    @media (max-width: 1024px) {
      .headline { font-size: 46px; }
      .headline .mandate { font-size: 36px; }
      .pillars { gap: 12px; }
    }
    @media (max-width: 768px) {
      .content { padding: 30px 20px; }
      .headline { font-size: 32px; }
      .headline .mandate { font-size: 26px; }
      .year-badge { font-size: 13px; padding: 6px 20px; }
      .pill { font-size: 11px; padding: 8px 14px; }
    }
    @media (max-width: 480px) {
      .headline { font-size: 24px; }
      .headline .mandate { font-size: 20px; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <div class="content">
    <div class="year-badge">2 0 2 6&nbsp;&nbsp;&nbsp;M A N D A T E</div>

    <div class="headline">
      <span class="zero-touch">Zero-touch security</span><br>
      <span class="automated-ops">and automated ops</span>
      <span class="mandate">
        The mandate to <span class="outpace">outpace</span><br>
        next-gen AI <span class="threats">competition and attacks</span>
      </span>
    </div>

    <div class="divider"></div>

    <div class="pillars">
      <div class="pill security"><span class="pill-dot"></span>Zero-Touch Security</div>
      <div class="pill automation"><span class="pill-dot"></span>Autonomous Ops</div>
      <div class="pill governance"><span class="pill-dot"></span>AI Governance</div>
      <div class="pill resilience"><span class="pill-dot"></span>Threat Resilience</div>
    </div>

    <div class="terminal">
      <span id="term">$ security posture: autonomous</span>
      <span class="cursor"></span>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const canvas = document.getElementById('bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0, visible = true, time = 0;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() {
    visible = !document.hidden;
    if (visible) animate();
  });

  const C = {
    purple: '#c084fc', cyan: '#60d5ff', green: '#34d399',
    yellow: '#fbbf24', pink: '#f472b6', red: '#f87171'
  };

  function rgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  // Shield nodes — floating security symbols
  const shields = [];
  const icons = ['◆', '⬡', '▲', '●', '◇', '⬢', '△'];
  const colors = [C.purple, C.cyan, C.green, C.yellow, C.pink, C.red];
  for (let i = 0; i < 25; i++) {
    shields.push({
      x: Math.random() * 1.2 - 0.1,
      y: Math.random() * 1.2 - 0.1,
      size: 10 + Math.random() * 18,
      speed: 0.0003 + Math.random() * 0.0008,
      drift: Math.random() * Math.PI * 2,
      icon: icons[Math.floor(Math.random() * icons.length)],
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2
    });
  }

  // Connection lines between nearby shields
  function drawConnections() {
    for (let i = 0; i < shields.length; i++) {
      for (let j = i + 1; j < shields.length; j++) {
        const a = shields[i], b = shields[j];
        const ax = a.x * W, ay = a.y * H;
        const bx = b.x * W, by = b.y * H;
        const dist = Math.hypot(ax - bx, ay - by);
        if (dist < 250) {
          const alpha = (1 - dist / 250) * 0.08;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.strokeStyle = rgba(C.purple, alpha);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
  }

  // Scanning beam
  function drawScanBeam() {
    const beamY = (Math.sin(time * 0.008) * 0.4 + 0.5) * H;
    const grad = ctx.createLinearGradient(0, beamY - 2, 0, beamY + 2);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, rgba(C.green, 0.06));
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, beamY - 40, W, 80);
  }

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    time++;

    // Grid
    ctx.strokeStyle = 'rgba(139, 92, 246, 0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 80) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    drawScanBeam();
    drawConnections();

    // Shield nodes
    shields.forEach(s => {
      s.x += Math.sin(time * s.speed + s.drift) * 0.0004;
      s.y += Math.cos(time * s.speed * 0.7 + s.drift) * 0.0003;
      if (s.x > 1.15) s.x = -0.1;
      if (s.x < -0.15) s.x = 1.1;
      if (s.y > 1.15) s.y = -0.1;
      if (s.y < -0.15) s.y = 1.1;

      const px = s.x * W, py = s.y * H;
      const pulse = 0.3 + Math.sin(time * 0.02 + s.phase) * 0.2;

      // Glow
      const g = ctx.createRadialGradient(px, py, 0, px, py, s.size * 3);
      g.addColorStop(0, rgba(s.color, pulse * 0.15));
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, s.size * 3, 0, Math.PI * 2);
      ctx.fill();

      // Icon
      ctx.font = s.size + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(s.color, pulse);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.icon, px, py);
    });

    // Corner annotations
    ctx.font = '400 12px "Fira Code", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = rgba('#94a3b8', 0.2);
    ctx.fillText('// zero-trust · zero-touch · zero-drift', 16, 16);

    ctx.textAlign = 'right';
    ctx.fillStyle = rgba(C.purple, 0.3);
    ctx.fillText('{ Stacktic }', W - 16, 16);
  }

  function animate() {
    if (!visible) return;
    draw();
    requestAnimationFrame(animate);
  }
  animate();

  // Terminal typing
  const cmds = [
    '$ security posture: autonomous',
    '$ zero-touch · zero-trust · zero-drift',
    '$ threat detection → automated response',
    '$ AI governance: enforced at every layer',
    '$ outpace attacks before they land',
  ];
  let ci = 0, chi = 0, del = false, wait = 0;
  (function type() {
    const el = document.getElementById('term');
    if (!el) return;
    const cmd = cmds[ci];
    if (!del) {
      if (chi < cmd.length) { el.textContent = cmd.substring(0, chi+1); chi++; setTimeout(type, 40); }
      else { wait++; if (wait > 50) { del = true; wait = 0; } setTimeout(type, 50); }
    } else {
      if (chi > 0) { chi--; el.textContent = cmd.substring(0, chi); setTimeout(type, 18); }
      else { del = false; ci = (ci+1) % cmds.length; setTimeout(type, 250); }
    }
  })();
});
</script>
</body>
</html>

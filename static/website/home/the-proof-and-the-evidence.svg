<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f0e24"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.5" fill="#94a3b8" opacity="0.06"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Central compliance seal / badge -->
  <circle cx="640" cy="280" r="100" fill="#f59e0b" opacity="0.02"/>
  <circle cx="640" cy="280" r="85" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="640" cy="280" r="75" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.1"/>

  <!-- Inner seal ring with notches like a certificate stamp -->
  <circle cx="640" cy="280" r="60" fill="#111128" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Notch marks around the seal -->
  <line x1="640" y1="218" x2="640" y2="225" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="640" y1="335" x2="640" y2="342" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="578" y1="280" x2="585" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="695" y1="280" x2="702" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Diagonal notches -->
  <line x1="597" y1="237" x2="602" y2="242" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="683" y1="237" x2="678" y2="242" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="597" y1="323" x2="602" y2="318" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="683" y1="323" x2="678" y2="318" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Checkmark in center -->
  <path d="M 618 280 L 634 296 L 664 260" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>

  <!-- Compliance framework labels orbiting the seal -->
  <!-- PCI -->
  <rect x="460" y="200" width="70" height="24" rx="4" fill="#111128" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="495" y="216" text-anchor="middle" font-size="9" fill="#a78bfa" opacity="0.5" font-family="monospace">PCI-DSS</text>
  <line x1="530" y1="212" x2="580" y2="245" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- HIPAA -->
  <rect x="750" y="200" width="60" height="24" rx="4" fill="#111128" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="780" y="216" text-anchor="middle" font-size="9" fill="#22d3ee" opacity="0.5" font-family="monospace">HIPAA</text>
  <line x1="750" y1="212" x2="700" y2="245" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- ISO -->
  <rect x="460" y="340" width="76" height="24" rx="4" fill="#111128" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="498" y="356" text-anchor="middle" font-size="9" fill="#34d399" opacity="0.5" font-family="monospace">ISO 27001</text>
  <line x1="536" y1="352" x2="585" y2="318" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- DORA -->
  <rect x="750" y="340" width="55" height="24" rx="4" fill="#111128" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="778" y="356" text-anchor="middle" font-size="9" fill="#818cf8" opacity="0.5" font-family="monospace">DORA</text>
  <line x1="750" y1="352" x2="700" y2="318" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Evidence trail - small document icons flowing down -->
  <rect x="610" y="400" width="16" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="614" y1="406" x2="622" y2="406" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="614" y1="410" x2="620" y2="410" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.12"/>

  <rect x="636" y="395" width="16" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="640" y1="401" x2="648" y2="401" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="640" y1="405" x2="646" y2="405" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="640" y1="409" x2="648" y2="409" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.15"/>

  <rect x="662" y="400" width="16" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="666" y1="406" x2="674" y2="406" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="666" y1="410" x2="672" y2="410" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.12"/>

  <text x="640" y="440" text-anchor="middle" font-size="8" fill="#94a3b8" opacity="0.2" font-family="monospace">audit reports</text>

  <!-- Title -->
  <text x="640" y="540" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="monospace" letter-spacing="4">The Proof &amp; the Evidence</text>

  <!-- Subtitle -->
  <text x="640" y="580" text-anchor="middle" font-size="14" fill="#94a3b8" opacity="0.4" font-family="monospace" letter-spacing="4">COMPLIANCE AUTOMATION</text>

  <!-- Thin line -->
  <line x1="440" y1="515" x2="840" y2="515" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.15"/>

  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.15" font-family="monospace">stacktic.io</text>
</svg>

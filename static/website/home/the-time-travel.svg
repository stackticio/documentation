<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f0e24"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.5" fill="#94a3b8" opacity="0.06"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Timeline - horizontal line through center -->
  <line x1="200" y1="310" x2="1080" y2="310" stroke="url(#tl)" stroke-width="1.5"/>

  <!-- Version snapshots along timeline -->
  <!-- v1 - far past (faded) -->
  <circle cx="280" cy="310" r="18" fill="#111128" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.15"/>
  <text x="280" y="314" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.25" font-family="monospace">v1</text>
  <line x1="280" y1="328" x2="280" y2="348" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="280" y="360" text-anchor="middle" font-size="8" fill="#94a3b8" opacity="0.15" font-family="monospace">snapshot</text>

  <!-- v2 -->
  <circle cx="400" cy="310" r="20" fill="#111128" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.2"/>
  <text x="400" y="314" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.3" font-family="monospace">v2</text>
  <line x1="400" y1="330" x2="400" y2="348" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="400" y="360" text-anchor="middle" font-size="8" fill="#94a3b8" opacity="0.2" font-family="monospace">snapshot</text>

  <!-- v3 -->
  <circle cx="530" cy="310" r="22" fill="#111128" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3"/>
  <text x="530" y="314" text-anchor="middle" font-size="10" fill="#22d3ee" opacity="0.4" font-family="monospace">v3</text>
  <line x1="530" y1="332" x2="530" y2="348" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="530" y="360" text-anchor="middle" font-size="8" fill="#22d3ee" opacity="0.25" font-family="monospace">snapshot</text>

  <!-- v4 -->
  <circle cx="660" cy="310" r="24" fill="#111128" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="660" y="314" text-anchor="middle" font-size="10" fill="#22d3ee" opacity="0.5" font-family="monospace">v4</text>
  <line x1="660" y1="334" x2="660" y2="348" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.25"/>
  <text x="660" y="360" text-anchor="middle" font-size="8" fill="#22d3ee" opacity="0.3" font-family="monospace">snapshot</text>

  <!-- v5 - current (brightest) -->
  <circle cx="800" cy="310" r="28" fill="#a78bfa" fill-opacity="0.06"/>
  <circle cx="800" cy="310" r="28" fill="#111128" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7"/>
  <text x="800" y="314" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" opacity="0.8" font-family="monospace">v5</text>
  <text x="800" y="280" text-anchor="middle" font-size="8" fill="#a78bfa" opacity="0.5" font-family="monospace">current</text>

  <!-- v6 - future (ghost) -->
  <circle cx="930" cy="310" r="22" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4,4"/>
  <text x="930" y="314" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.1" font-family="monospace">v6</text>

  <!-- Rollback arrow curving back from v5 to v3 -->
  <path d="M 790 282 Q 660 200 540 282" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,3"/>
  <!-- Arrow head -->
  <polygon points="540,282 548,274 546,286" fill="#f59e0b" opacity="0.4"/>
  <text x="665" y="225" text-anchor="middle" font-size="9" fill="#f59e0b" opacity="0.45" font-family="monospace">rollback</text>

  <!-- Small rewind icon near the rollback arrow -->
  <text x="665" y="245" text-anchor="middle" font-size="12" fill="#f59e0b" opacity="0.3" font-family="monospace">&lt;&lt;</text>

  <!-- Vertical stack layers inside v5 to show it's a full snapshot -->
  <rect x="780" y="370" width="40" height="8" rx="2" fill="#a78bfa" opacity="0.15"/>
  <rect x="780" y="382" width="40" height="8" rx="2" fill="#22d3ee" opacity="0.12"/>
  <rect x="780" y="394" width="40" height="8" rx="2" fill="#34d399" opacity="0.1"/>
  <text x="835" y="378" font-size="7" fill="#94a3b8" opacity="0.25" font-family="monospace">infra</text>
  <text x="835" y="390" font-size="7" fill="#94a3b8" opacity="0.25" font-family="monospace">apps</text>
  <text x="835" y="402" font-size="7" fill="#94a3b8" opacity="0.25" font-family="monospace">config</text>

  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-size="52" font-weight="700" fill="#ffffff" font-family="monospace" letter-spacing="5">The Time Travel</text>

  <!-- Subtitle -->
  <text x="640" y="600" text-anchor="middle" font-size="14" fill="#94a3b8" opacity="0.4" font-family="monospace" letter-spacing="4">ROLLBACK AND VERSIONING</text>

  <!-- Thin line -->
  <line x1="490" y1="535" x2="790" y2="535" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.15"/>

  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.15" font-family="monospace">stacktic.io</text>
</svg>

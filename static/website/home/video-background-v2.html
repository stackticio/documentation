<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacktic Video Background v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Fira Code', monospace; background: #060612; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0, frame = 0, vis = true;

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var purple = '#a78bfa', cyan = '#22d3ee', green = '#34d399', yellow = '#fbbf24';
  var indigo = '#818cf8', pink = '#f472b6', red = '#ef4444', orange = '#fb923c';
  var dim = '#94a3b8', white = '#e2e8f0';

  function roundRect(x,y,w,h,r) {
    if (w<1||h<1) return;
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function resize() {
    W = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0, 800);
    H = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0, 600);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ── Stack layers ──
  var stackLayers = [
    { name: 'CI/CD', color: red, items: ['ArgoCD', 'GitHub Actions', 'Helm Charts'] },
    { name: 'Application', color: green, items: ['FastAPI', 'React', 'Langflow', 'Ollama'] },
    { name: 'Data Layer', color: cyan, items: ['MongoDB', 'PostgreSQL', 'Redis', 'Kafka'] },
    { name: 'Observability', color: orange, items: ['Prometheus', 'Grafana', 'Alertmanager'] },
    { name: 'Security', color: purple, items: ['OPA', 'RBAC', 'NetPol', 'SOPS'] },
    { name: 'Infrastructure', color: indigo, items: ['APISIX', 'Docker', 'K8s', 'Helm'] }
  ];

  // ── Link types ──
  var linkTypes = [
    { name: 'fastapi-mongodb', color: green },
    { name: 'react-apisix', color: cyan },
    { name: 'prometheus-grafana', color: orange },
    { name: 'apisix-langflow', color: purple },
    { name: 'kafka-airflow', color: yellow },
    { name: 'fastapi-redis', color: red }
  ];

  // ── Particles ──
  var particles = [];
  for (var i = 0; i < 80; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      s: 0.8 + Math.random() * 2.5,
      ph: Math.random() * Math.PI * 2,
      vy: -0.0004 - Math.random() * 0.0008,
      vx: (Math.random() - 0.5) * 0.0004,
      color: [purple, cyan, green, yellow, indigo, pink][Math.floor(Math.random() * 6)]
    });
  }

  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() { vis = !document.hidden; if (vis) animate(); });

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    frame++;
    var cx = W / 2, cy = H / 2;

    // ═══════════════════
    //  BACKGROUND
    // ═══════════════════
    var vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    vig.addColorStop(0, '#100f28');
    vig.addColorStop(0.5, '#080818');
    vig.addColorStop(1, '#030306');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Dot grid
    ctx.fillStyle = rgba(indigo, 0.12);
    for (var dx = 20; dx < W; dx += 40) {
      for (var dy = 20; dy < H; dy += 40) {
        ctx.beginPath(); ctx.arc(dx, dy, 1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ═══════════════════
    //  HORIZONTAL STACK BANDS
    // ═══════════════════
    var bandH = H * 0.07;
    var bandGap = H * 0.10;
    var bandsStartY = cy - (stackLayers.length * bandGap) / 2 + bandGap * 0.3;

    for (var bi = 0; bi < stackLayers.length; bi++) {
      var band = stackLayers[bi];
      var by = bandsStartY + bi * bandGap;
      var drift = Math.sin(frame * 0.004 + bi * 1.1) * 12;
      var bandPulse = 0.7 + Math.sin(frame * 0.01 + bi * 0.7) * 0.15;

      // Band fill
      var bandGrad = ctx.createLinearGradient(0, 0, W, 0);
      bandGrad.addColorStop(0, 'transparent');
      bandGrad.addColorStop(0.08, rgba(band.color, 0.06 * bandPulse));
      bandGrad.addColorStop(0.5, rgba(band.color, 0.1 * bandPulse));
      bandGrad.addColorStop(0.92, rgba(band.color, 0.06 * bandPulse));
      bandGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = bandGrad;
      ctx.fillRect(0, by + drift - bandH/2, W, bandH);

      // Band border lines
      ctx.beginPath();
      ctx.moveTo(W * 0.06, by + drift - bandH/2);
      ctx.lineTo(W * 0.94, by + drift - bandH/2);
      ctx.strokeStyle = rgba(band.color, 0.2 * bandPulse); ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(W * 0.06, by + drift + bandH/2);
      ctx.lineTo(W * 0.94, by + drift + bandH/2);
      ctx.stroke();

      // Layer name (left)
      ctx.font = '700 13px "Fira Code", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(band.color, 0.55 * bandPulse);
      ctx.fillText(band.name, W * 0.03, by + drift);

      // Component pills
      for (var ii = 0; ii < band.items.length; ii++) {
        var itemX = W * 0.2 + ii * (W * 0.18) + Math.sin(frame * 0.005 + bi * 2 + ii * 1.5) * 25;
        var itemPulse = 0.6 + Math.sin(frame * 0.015 + bi * 1.2 + ii * 0.9) * 0.2;

        var pillW = 95, pillH = 24;
        roundRect(itemX - pillW/2, by + drift - pillH/2, pillW, pillH, 12);
        ctx.fillStyle = rgba(band.color, 0.08 * itemPulse); ctx.fill();
        ctx.strokeStyle = rgba(band.color, 0.35 * itemPulse); ctx.lineWidth = 1.5; ctx.stroke();

        ctx.font = '500 10px "Fira Code", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(band.color, 0.7 * itemPulse);
        ctx.fillText(band.items[ii], itemX, by + drift);
      }
    }

    // ═══════════════════
    //  VERTICAL DATA FLOWS (connecting bands)
    // ═══════════════════
    var flowTop = bandsStartY - bandGap * 0.5;
    var flowBottom = bandsStartY + stackLayers.length * bandGap;

    for (var vl = 0; vl < 10; vl++) {
      var vlX = W * 0.12 + vl * W * 0.085 + Math.sin(frame * 0.003 + vl * 0.8) * 15;
      var vlPulse = 0.5 + Math.sin(frame * 0.012 + vl * 1.3) * 0.2;

      // Dashed vertical line
      ctx.beginPath();
      ctx.moveTo(vlX, flowTop);
      ctx.lineTo(vlX, flowBottom);
      ctx.strokeStyle = rgba(dim, 0.08 * vlPulse); ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]); ctx.stroke(); ctx.setLineDash([]);

      // Data packet (bright moving dot)
      var pktT = ((frame * 0.01 + vl * 0.25) % 1);
      var pktY = flowTop + pktT * (flowBottom - flowTop);
      var pktColor = [cyan, green, purple, orange, yellow][vl % 5];

      // Glow
      var pg = ctx.createRadialGradient(vlX, pktY, 0, vlX, pktY, 12);
      pg.addColorStop(0, rgba(pktColor, 0.5));
      pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(vlX, pktY, 12, 0, Math.PI * 2); ctx.fill();

      // Core dot
      ctx.beginPath(); ctx.arc(vlX, pktY, 3, 0, Math.PI * 2);
      ctx.fillStyle = rgba(pktColor, 0.9); ctx.fill();

      // Trail
      for (var tr = 1; tr <= 4; tr++) {
        var trY = pktY - tr * 8;
        ctx.beginPath(); ctx.arc(vlX, trY, 2, 0, Math.PI * 2);
        ctx.fillStyle = rgba(pktColor, 0.4 - tr * 0.08); ctx.fill();
      }
    }

    // ═══════════════════
    //  LINK TYPE LABELS (orbiting around edges)
    // ═══════════════════
    for (var lt = 0; lt < linkTypes.length; lt++) {
      var lk = linkTypes[lt];
      var lAngle = (lt / linkTypes.length) * Math.PI * 2 + 0.5;
      var lR = 0.38 + Math.sin(frame * 0.004 + lt * 1.4) * 0.03;
      var lx = cx + Math.cos(lAngle + frame * 0.001) * W * lR;
      var ly = cy + Math.sin(lAngle + frame * 0.001) * H * lR * 0.42;
      var lPulse = 0.6 + Math.sin(frame * 0.012 + lt * 2.1) * 0.2;

      // Background box
      var lbW = 130, lbH = 24;
      roundRect(lx - lbW/2, ly - lbH/2, lbW, lbH, 5);
      ctx.fillStyle = rgba('#0f0e24', 0.7); ctx.fill();
      ctx.strokeStyle = rgba(lk.color, 0.4 * lPulse); ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);

      // Text
      ctx.font = '500 10px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(lk.color, 0.75 * lPulse);
      ctx.fillText('\u2192 ' + lk.name, lx, ly);
    }

    // ═══════════════════
    //  FLOATING PARTICLES
    // ═══════════════════
    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -0.03) { p.y = 1.03; p.x = Math.random(); }
      if (p.x < -0.03) p.x = 1.03;
      if (p.x > 1.03) p.x = -0.03;
      var pa = 0.3 + Math.sin(frame * 0.015 + p.ph) * 0.15;

      // Big particles get glow
      if (p.s > 1.8) {
        var ppg = ctx.createRadialGradient(p.x*W, p.y*H, 0, p.x*W, p.y*H, p.s*4);
        ppg.addColorStop(0, rgba(p.color, pa * 0.3));
        ppg.addColorStop(1, 'transparent');
        ctx.fillStyle = ppg;
        ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.s*4, 0, Math.PI*2); ctx.fill();
      }

      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.s, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.color, pa); ctx.fill();
    }

    // ═══════════════════
    //  PULSE WAVES
    // ═══════════════════
    for (var pw = 0; pw < 3; pw++) {
      var pOff = pw * 80;
      var pPhase = ((frame + pOff) % 240) / 240;
      if (pPhase < 0.7) {
        var pR = pPhase * Math.max(W, H) * 0.85;
        var pA = (1 - pPhase / 0.7) * 0.12;
        ctx.beginPath(); ctx.arc(cx, cy, pR, 0, Math.PI * 2);
        ctx.strokeStyle = rgba([cyan, purple, green][pw], pA);
        ctx.lineWidth = 1.5; ctx.stroke();
      }
    }

    // ═══════════════════
    //  SCANNING LINE
    // ═══════════════════
    var scanY = ((frame * 0.7) % (H + 80)) - 40;
    var scanGrad = ctx.createLinearGradient(0, scanY - 25, 0, scanY + 25);
    scanGrad.addColorStop(0, 'transparent');
    scanGrad.addColorStop(0.5, rgba(cyan, 0.08));
    scanGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = scanGrad;
    ctx.fillRect(0, scanY - 25, W, 50);
    ctx.beginPath(); ctx.moveTo(0, scanY); ctx.lineTo(W, scanY);
    ctx.strokeStyle = rgba(cyan, 0.15); ctx.lineWidth = 1; ctx.stroke();

    // ═══════════════════
    //  CORNER BRACKETS
    // ═══════════════════
    var brA = 0.25 + Math.sin(frame * 0.012) * 0.08;
    var brLen = 50, brOff = 18;
    ctx.strokeStyle = rgba(indigo, brA); ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(brOff, brOff+brLen); ctx.lineTo(brOff, brOff); ctx.lineTo(brOff+brLen, brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, brOff); ctx.lineTo(W-brOff, brOff); ctx.lineTo(W-brOff, brOff+brLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(brOff, H-brOff-brLen); ctx.lineTo(brOff, H-brOff); ctx.lineTo(brOff+brLen, H-brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, H-brOff); ctx.lineTo(W-brOff, H-brOff); ctx.lineTo(W-brOff, H-brOff-brLen); ctx.stroke();

    // Corner dots
    var cdA = 0.6 + Math.sin(frame * 0.03) * 0.3;
    [[brOff,brOff],[W-brOff,brOff],[brOff,H-brOff],[W-brOff,H-brOff]].forEach(function(c) {
      ctx.beginPath(); ctx.arc(c[0], c[1], 3.5, 0, Math.PI*2);
      ctx.fillStyle = rgba(indigo, cdA); ctx.fill();
    });

    // ═══════════════════
    //  WATERMARK
    // ═══════════════════
    var wmA = 0.07 + Math.sin(frame * 0.006) * 0.02;
    ctx.save(); ctx.globalAlpha = wmA;
    ctx.font = '700 ' + Math.min(W * 0.065, 80) + 'px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var wg = ctx.createLinearGradient(cx - W*0.18, cy, cx + W*0.18, cy);
    wg.addColorStop(0, purple); wg.addColorStop(0.35, cyan); wg.addColorStop(0.65, green); wg.addColorStop(1, yellow);
    ctx.fillStyle = wg;
    ctx.fillText('STACKTIC', cx, cy);
    ctx.restore();

    // Top badge
    ctx.save(); ctx.globalAlpha = 0.35;
    roundRect(cx - 100, 14, 200, 26, 13);
    ctx.fillStyle = rgba('#0f0e24', 0.8); ctx.fill();
    ctx.strokeStyle = rgba(cyan, 0.3); ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '500 10px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(cyan, 0.8);
    ctx.fillText('stack-v3  //  production', cx, 27);
    ctx.restore();

    // Bottom pipeline
    ctx.save(); ctx.globalAlpha = 0.35;
    var flowY = H - 30;
    var steps = ['Integrate', 'Assemble', 'Generate', 'Deploy', 'Observe'];
    var stepW = 90, stepGap = 18;
    var totalFW = steps.length * stepW + (steps.length - 1) * stepGap;
    var flowSX = cx - totalFW / 2;

    for (var fi = 0; fi < steps.length; fi++) {
      var sx = flowSX + fi * (stepW + stepGap);
      var sPulse = 0.7 + Math.sin(frame * 0.025 + fi * 0.8) * 0.2;

      roundRect(sx, flowY - 11, stepW, 22, 11);
      ctx.fillStyle = rgba(green, 0.1 * sPulse); ctx.fill();
      ctx.strokeStyle = rgba(green, 0.35 * sPulse); ctx.lineWidth = 1; ctx.stroke();

      ctx.font = '600 10px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(green, 0.8 * sPulse);
      ctx.fillText(steps[fi], sx + stepW/2, flowY);

      if (fi < steps.length - 1) {
        var arX = sx + stepW + 2;
        ctx.beginPath(); ctx.moveTo(arX, flowY); ctx.lineTo(arX + stepGap - 4, flowY);
        ctx.strokeStyle = rgba(green, 0.3); ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(arX + stepGap - 4, flowY);
        ctx.lineTo(arX + stepGap - 8, flowY - 3);
        ctx.lineTo(arX + stepGap - 8, flowY + 3);
        ctx.closePath();
        ctx.fillStyle = rgba(green, 0.3); ctx.fill();

        // spark
        var sst = ((frame * 0.025 + fi * 0.4) % 1);
        ctx.beginPath(); ctx.arc(arX + sst * (stepGap - 4), flowY, 2.5, 0, Math.PI*2);
        ctx.fillStyle = rgba(green, 0.6); ctx.fill();
      }
    }
    ctx.restore();

    // Brand
    ctx.save(); ctx.globalAlpha = 0.25;
    ctx.font = '400 10px "Fira Code", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = rgba(dim, 0.6);
    ctx.fillText('stacktic.io', W - 24, H - 12);
    ctx.restore();
  }

  function animate() {
    if (!vis) return;
    draw();
    requestAnimationFrame(animate);
  }

  if (document.readyState === 'complete') { resize(); animate(); }
  else { window.addEventListener('load', function() { resize(); animate(); }); }
})();
</script>
</body>
</html>

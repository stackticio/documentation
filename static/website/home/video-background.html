<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacktic Video Background</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Fira Code', monospace; background: #0a0a1a; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0, frame = 0, vis = true;

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var purple = '#a78bfa', cyan = '#22d3ee', green = '#34d399', yellow = '#fbbf24';
  var indigo = '#818cf8', pink = '#f472b6', red = '#f87171', orange = '#fb923c';
  var dim = '#64748b', white = '#e2e8f0';

  function roundRect(x,y,w,h,r) {
    if (w<1||h<1) return;
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function resize() {
    W = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0, 800);
    H = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0, 600);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStack();
  }

  // ── Stacktic components (the real entities) ──
  var components = [
    { name: 'FastAPI', icon: '\u26A1', color: '#059669', type: 'app' },
    { name: 'React', icon: '\u269B', color: '#0891b2', type: 'app' },
    { name: 'MongoDB', icon: '\u25C6', color: '#16a34a', type: 'data' },
    { name: 'PostgreSQL', icon: '\u25A3', color: '#2563eb', type: 'data' },
    { name: 'Redis', icon: '\u25C9', color: '#dc2626', type: 'data' },
    { name: 'Kafka', icon: '\u2263', color: '#7c3aed', type: 'data' },
    { name: 'APISIX', icon: '\u2B21', color: '#e11d48', type: 'infra' },
    { name: 'Prometheus', icon: '\u2609', color: '#ea580c', type: 'obs' },
    { name: 'Grafana', icon: '\u25CE', color: '#f59e0b', type: 'obs' },
    { name: 'ArgoCD', icon: '\u21BB', color: '#ef4444', type: 'infra' },
    { name: 'Helm', icon: '\u2388', color: '#0284c7', type: 'infra' },
    { name: 'Langflow', icon: '\u2B22', color: '#8b5cf6', type: 'ai' },
    { name: 'Ollama', icon: '\u25C8', color: '#6366f1', type: 'ai' },
    { name: 'Airflow', icon: '\u2708', color: '#0d9488', type: 'data' },
    { name: 'RabbitMQ', icon: '\u2742', color: '#f97316', type: 'data' },
    { name: 'Docker', icon: '\u2B1B', color: '#0ea5e9', type: 'infra' }
  ];

  // ── Stack topology (floating component nodes) ──
  var stackNodes = [];
  var stackLinks = [];

  function buildStack() {
    stackNodes = [];
    stackLinks = [];
    var count = components.length;
    // Spread components across the canvas organically
    for (var i = 0; i < count; i++) {
      var c = components[i];
      // Organic placement in a wide spread
      var angle = (i / count) * Math.PI * 2 + 0.3;
      var dist = 0.2 + (i % 3) * 0.08 + Math.sin(i * 1.7) * 0.06;
      stackNodes.push({
        baseX: 0.5 + Math.cos(angle) * dist,
        baseY: 0.5 + Math.sin(angle) * dist,
        x: 0, y: 0,
        orbitR: 0.005 + Math.random() * 0.01,
        orbitSpeed: 0.002 + Math.random() * 0.004,
        ph: Math.random() * Math.PI * 2,
        comp: c,
        size: 28 + Math.random() * 10
      });
    }
    // Build links (simulating stacktic link relationships)
    var linkPairs = [
      [0,2],[0,3],[0,6],[1,0],[1,6],[2,7],[3,7],[4,0],[4,1],
      [5,0],[5,14],[6,11],[7,8],[9,10],[10,0],[10,1],[11,12],
      [13,2],[13,5],[14,0],[15,0],[15,1]
    ];
    for (var li = 0; li < linkPairs.length; li++) {
      var p = linkPairs[li];
      if (p[0] < count && p[1] < count) {
        stackLinks.push({ from: p[0], to: p[1], sparkOffset: Math.random() });
      }
    }
  }

  // ── Floating code snippets (yaml-like) ──
  var codeSnippets = [
    ['apiVersion: stacktic/v1', 'kind: Stack', 'metadata:', '  name: production'],
    ['links:', '  - fastapi-mongodb', '  - react-apisix', '  - prometheus-grafana'],
    ['components:', '  - type: fastapi', '    namespace: app', '    version: 3.2.1'],
    ['security:', '  rbac: enabled', '  opa: enforced', '  netpol: auto'],
    ['helm:', '  chart: stacktic/app', '  values:', '    replicas: 3'],
    ['observability:', '  prometheus: true', '  grafana: true', '  alerts: auto']
  ];

  // ── Namespace boxes floating ──
  var namespaces = [
    { name: 'ns: app-backend', color: green },
    { name: 'ns: data-layer', color: cyan },
    { name: 'ns: observability', color: orange },
    { name: 'ns: ingress-apisix', color: red },
    { name: 'ns: ai-services', color: purple }
  ];

  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() { vis = !document.hidden; if (vis) animate(); });

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    frame++;

    var centerX = W / 2, centerY = H / 2;

    // ═══════════════════
    //  BACKGROUND
    // ═══════════════════
    var vig = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.75);
    vig.addColorStop(0, '#100f28');
    vig.addColorStop(0.5, '#0a0a1a');
    vig.addColorStop(1, '#040408');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // ═══════════════════
    //  GRID (K8s-style topology grid)
    // ═══════════════════
    ctx.strokeStyle = rgba(indigo, 0.02); ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += 55) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for (var gy = 0; gy < H; gy += 55) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

    // ═══════════════════
    //  LINK CONNECTIONS (draw first, behind nodes)
    // ═══════════════════
    for (var li = 0; li < stackLinks.length; li++) {
      var link = stackLinks[li];
      var nFrom = stackNodes[link.from];
      var nTo = stackNodes[link.to];
      if (!nFrom || !nTo) continue;

      var fx = nFrom.x * W, fy = nFrom.y * H;
      var tx = nTo.x * W, ty = nTo.y * H;

      // Connection line
      var lineA = 0.06 + Math.sin(frame * 0.01 + li * 0.4) * 0.025;
      ctx.beginPath();
      // Curved bezier for organic feel
      var mx = (fx + tx) / 2 + Math.sin(li * 2.1) * 30;
      var my = (fy + ty) / 2 + Math.cos(li * 1.7) * 30;
      ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(mx, my, tx, ty);
      ctx.strokeStyle = rgba(nFrom.comp.color, lineA);
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Travelling data spark
      var sparkT = ((frame * 0.005 + link.sparkOffset) % 1);
      var st = sparkT;
      var spx = (1-st)*(1-st)*fx + 2*(1-st)*st*mx + st*st*tx;
      var spy = (1-st)*(1-st)*fy + 2*(1-st)*st*my + st*st*ty;

      var sg = ctx.createRadialGradient(spx, spy, 0, spx, spy, 6);
      sg.addColorStop(0, rgba(nFrom.comp.color, 0.5));
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(spx, spy, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(spx, spy, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = rgba(white, 0.6); ctx.fill();
    }

    // ═══════════════════
    //  COMPONENT NODES
    // ═══════════════════
    for (var ni = 0; ni < stackNodes.length; ni++) {
      var n = stackNodes[ni];
      // Gentle orbit
      n.x = n.baseX + Math.cos(frame * n.orbitSpeed + n.ph) * n.orbitR;
      n.y = n.baseY + Math.sin(frame * n.orbitSpeed * 0.8 + n.ph) * n.orbitR;

      var nx = n.x * W, ny = n.y * H;
      var sz = n.size;
      var c = n.comp;
      var pulse = 0.6 + Math.sin(frame * 0.02 + ni * 0.9) * 0.15;

      // Outer glow
      var ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, sz * 1.5);
      ng.addColorStop(0, rgba(c.color, 0.07 * pulse));
      ng.addColorStop(1, 'transparent');
      ctx.fillStyle = ng;
      ctx.beginPath(); ctx.arc(nx, ny, sz * 1.5, 0, Math.PI * 2); ctx.fill();

      // Node box
      roundRect(nx - sz/2, ny - sz/2, sz, sz, 8);
      ctx.fillStyle = rgba('#111128', 0.85); ctx.fill();
      ctx.strokeStyle = rgba(c.color, 0.3 * pulse); ctx.lineWidth = 1.5; ctx.stroke();

      // Top accent line
      ctx.beginPath();
      ctx.moveTo(nx - sz/2 + 6, ny - sz/2);
      ctx.lineTo(nx + sz/2 - 6, ny - sz/2);
      ctx.strokeStyle = rgba(c.color, 0.5 * pulse); ctx.lineWidth = 2; ctx.stroke();

      // Icon
      ctx.font = '600 ' + (sz * 0.38) + 'px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(c.color, 0.7 * pulse);
      ctx.fillText(c.icon, nx, ny - 2);

      // Component name
      ctx.font = '400 ' + Math.max(7, sz * 0.22) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(white, 0.3 * pulse);
      ctx.fillText(c.name, nx, ny + sz * 0.32);
    }

    // ═══════════════════
    //  FLOATING YAML CODE SNIPPETS
    // ═══════════════════
    for (var ci = 0; ci < codeSnippets.length; ci++) {
      var snippet = codeSnippets[ci];
      var codeAngle = (ci / codeSnippets.length) * Math.PI * 2;
      var codeR = 0.42 + Math.sin(frame * 0.003 + ci * 1.2) * 0.03;
      var codeX = centerX + Math.cos(codeAngle + frame * 0.001) * W * codeR;
      var codeY = centerY + Math.sin(codeAngle + frame * 0.001) * H * codeR * 0.5;
      var codeA = 0.08 + Math.sin(frame * 0.008 + ci * 2) * 0.03;

      ctx.save(); ctx.globalAlpha = codeA;

      // Code block background
      var blockW = 155, blockH = snippet.length * 14 + 10;
      roundRect(codeX - blockW/2, codeY - blockH/2, blockW, blockH, 6);
      ctx.fillStyle = rgba('#111128', 0.7); ctx.fill();
      ctx.strokeStyle = rgba(indigo, 0.15); ctx.lineWidth = 1; ctx.stroke();

      // Code lines
      ctx.font = '400 9px "Fira Code", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      for (var sl = 0; sl < snippet.length; sl++) {
        var line = snippet[sl];
        var isKey = line.indexOf(':') > -1 && line.indexOf(' ') !== 0;
        ctx.fillStyle = isKey ? rgba(cyan, 0.8) : rgba(dim, 0.7);
        if (line.indexOf('-') > -1) ctx.fillStyle = rgba(green, 0.7);
        ctx.fillText(line, codeX - blockW/2 + 8, codeY - blockH/2 + 6 + sl * 14);
      }

      ctx.restore();
    }

    // ═══════════════════
    //  NAMESPACE LABELS (floating)
    // ═══════════════════
    for (var nsi = 0; nsi < namespaces.length; nsi++) {
      var ns = namespaces[nsi];
      var nsAngle = (nsi / namespaces.length) * Math.PI * 2 + Math.PI * 0.15;
      var nsR = 0.33 + Math.sin(frame * 0.004 + nsi * 0.8) * 0.02;
      var nsX = centerX + Math.cos(nsAngle + frame * 0.0015) * W * nsR;
      var nsY = centerY + Math.sin(nsAngle + frame * 0.0015) * H * nsR * 0.55;
      var nsA = 0.12 + Math.sin(frame * 0.01 + nsi * 1.5) * 0.04;

      ctx.save(); ctx.globalAlpha = nsA;

      // Dashed namespace border
      var nsW = 110, nsH = 22;
      roundRect(nsX - nsW/2, nsY - nsH/2, nsW, nsH, 4);
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = rgba(ns.color, 0.5); ctx.lineWidth = 1; ctx.stroke();
      ctx.setLineDash([]);

      // Label
      ctx.font = '500 9px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(ns.color, 0.8);
      ctx.fillText(ns.name, nsX, nsY);

      ctx.restore();
    }

    // ═══════════════════
    //  STACK VERSION BADGE (top area)
    // ═══════════════════
    var badgeA = 0.1 + Math.sin(frame * 0.008) * 0.03;
    ctx.save(); ctx.globalAlpha = badgeA;
    var badgeX = centerX, badgeY = H * 0.06;
    roundRect(badgeX - 90, badgeY - 12, 180, 24, 12);
    ctx.fillStyle = rgba('#111128', 0.8); ctx.fill();
    ctx.strokeStyle = rgba(cyan, 0.3); ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '500 10px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(cyan, 0.8);
    ctx.fillText('stack-v3  //  production', badgeX, badgeY);
    ctx.restore();

    // ═══════════════════
    //  PULSE WAVE (from center, subtle)
    // ═══════════════════
    var pulseT = (frame % 240) / 240;
    if (pulseT < 0.7) {
      var pr = pulseT * Math.max(W, H) * 0.8;
      var pa = (1 - pulseT / 0.7) * 0.06;
      ctx.beginPath(); ctx.arc(centerX, centerY, pr, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(indigo, pa); ctx.lineWidth = 1.5; ctx.stroke();
    }
    var pulse2T = ((frame + 120) % 240) / 240;
    if (pulse2T < 0.7) {
      var p2r = pulse2T * Math.max(W, H) * 0.8;
      var p2a = (1 - pulse2T / 0.7) * 0.04;
      ctx.beginPath(); ctx.arc(centerX, centerY, p2r, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(cyan, p2a); ctx.lineWidth = 1; ctx.stroke();
    }

    // ═══════════════════
    //  PROCESS FLOW BAR (bottom, the stacktic pipeline)
    // ═══════════════════
    var flowA = 0.1 + Math.sin(frame * 0.007) * 0.03;
    ctx.save(); ctx.globalAlpha = flowA;

    var flowY = H * 0.93;
    var steps = ['Integrate', 'Assemble', 'Generate', 'Deploy', 'Observe'];
    var stepW = W * 0.1;
    var totalFlowW = steps.length * stepW + (steps.length - 1) * 20;
    var flowStartX = centerX - totalFlowW / 2;

    for (var fi = 0; fi < steps.length; fi++) {
      var sx = flowStartX + fi * (stepW + 20);
      var stepPulse = 0.6 + Math.sin(frame * 0.025 + fi * 0.8) * 0.2;

      // Step pill
      roundRect(sx, flowY - 12, stepW, 24, 12);
      ctx.fillStyle = rgba(green, 0.12 * stepPulse); ctx.fill();
      ctx.strokeStyle = rgba(green, 0.25 * stepPulse); ctx.lineWidth = 1; ctx.stroke();

      ctx.font = '600 10px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(green, 0.7 * stepPulse);
      ctx.fillText(steps[fi], sx + stepW / 2, flowY);

      // Arrow between steps
      if (fi < steps.length - 1) {
        var arrowX = sx + stepW + 3;
        ctx.beginPath();
        ctx.moveTo(arrowX, flowY); ctx.lineTo(arrowX + 14, flowY);
        ctx.strokeStyle = rgba(green, 0.2); ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(arrowX + 14, flowY);
        ctx.lineTo(arrowX + 10, flowY - 3);
        ctx.lineTo(arrowX + 10, flowY + 3);
        ctx.closePath();
        ctx.fillStyle = rgba(green, 0.2); ctx.fill();

        // Spark on arrow
        var ast = ((frame * 0.02 + fi * 0.3) % 1);
        var aspx = arrowX + ast * 14;
        ctx.beginPath(); ctx.arc(aspx, flowY, 2, 0, Math.PI * 2);
        ctx.fillStyle = rgba(green, 0.4); ctx.fill();
      }
    }
    ctx.restore();

    // ═══════════════════
    //  CORNER BRACKETS
    // ═══════════════════
    var brA = 0.12 + Math.sin(frame * 0.01) * 0.04;
    var brLen = 45, brOff = 20;
    ctx.strokeStyle = rgba(indigo, brA); ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(brOff, brOff + brLen); ctx.lineTo(brOff, brOff); ctx.lineTo(brOff + brLen, brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, brOff); ctx.lineTo(W-brOff, brOff); ctx.lineTo(W-brOff, brOff+brLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(brOff, H-brOff-brLen); ctx.lineTo(brOff, H-brOff); ctx.lineTo(brOff+brLen, H-brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, H-brOff); ctx.lineTo(W-brOff, H-brOff); ctx.lineTo(W-brOff, H-brOff-brLen); ctx.stroke();

    // ═══════════════════
    //  STACKTIC WATERMARK
    // ═══════════════════
    var wmA = 0.04 + Math.sin(frame * 0.005) * 0.012;
    ctx.save(); ctx.globalAlpha = wmA;
    ctx.font = '700 ' + Math.min(W * 0.06, 75) + 'px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var wg = ctx.createLinearGradient(centerX - W * 0.15, centerY, centerX + W * 0.15, centerY);
    wg.addColorStop(0, purple); wg.addColorStop(0.35, cyan); wg.addColorStop(0.65, green); wg.addColorStop(1, yellow);
    ctx.fillStyle = wg;
    ctx.fillText('STACKTIC', centerX, centerY);
    ctx.restore();

    // Brand
    ctx.save(); ctx.globalAlpha = 0.12;
    ctx.font = '400 ' + Math.max(9, W * 0.007) + 'px "Fira Code", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = rgba(dim, 0.5);
    ctx.fillText('stacktic.io', W - 28, H - 14);
    ctx.restore();
  }

  function drawHex(x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 3 * i - Math.PI / 6;
      ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
    }
    ctx.closePath(); ctx.stroke();
  }

  function animate() {
    if (!vis) return;
    draw();
    requestAnimationFrame(animate);
  }

  if (document.readyState === 'complete') { resize(); animate(); }
  else { window.addEventListener('load', function() { resize(); animate(); }); }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intent Propagation — draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070f;color:#c0bcdf;font-family:'Sora',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:30px;padding:50px 20px 80px}
.card{background:#0a0e1c;border:1px solid rgba(175,170,230,.12);border-radius:20px;
  padding:36px 34px 30px;width:100%;max-width:560px;text-align:center}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.28em;text-transform:uppercase;color:#565378;margin-bottom:20px}
svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.cap{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  letter-spacing:.26em;color:#34d399;margin-top:28px}
.sub{font-size:15px;line-height:1.65;color:#9793c0;margin-top:12px;max-width:32ch;
  margin-left:auto;margin-right:auto}
</style>
</head>
<body>

<!-- ════════ 1 · ORIGINAL — untouched (all lines start at the same x) ════════ -->
<div class="card">
  <div class="tag">1 · original — untouched</div>
  <svg viewBox="0 0 520 400">
    <defs>
      <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#34d399"/></linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
      <linearGradient id="gC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
      <linearGradient id="gD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="gE" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    </defs>
    <g fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <!-- outer top: wraps over the point, hook turns down toward the dot -->
      <path d="M115 96 H206 C258 96,252 146,318 152 C362 156,380 144,404 142 Q426 141,426 156 V172" stroke="url(#gA)"/>
      <!-- inner top: folds into the point -->
      <path d="M115 148 H238 C272 148,278 160,306 176" stroke="url(#gB)"/>
      <!-- spine -->
      <path d="M115 200 H288" stroke="url(#gC)"/>
      <!-- inner bottom (mirror) -->
      <path d="M115 252 H238 C272 252,278 240,306 224" stroke="url(#gD)"/>
      <!-- outer bottom (mirror), hook turns up toward the dot -->
      <path d="M115 304 H206 C258 304,252 254,318 248 C362 244,380 256,404 258 Q426 259,426 244 V228" stroke="url(#gE)"/>
    </g>
    <!-- spear tip on the spine -->
    <polygon points="288,174 350,200 288,226" fill="#818cf8"/>
    <!-- hub -->
    <circle cx="474" cy="200" r="27" fill="#34d399"/>
  </svg>
  <div class="cap">2. INTENT PROPAGATION</div>
  <p class="sub">Intent moves through layers, adapting to context and guiding aligned action everywhere.</p>
</div>

<!-- ════════ 2 · CHANGE 1 only — staggered left starts, nothing else moved ════════ -->
<div class="card">
  <div class="tag">2 · staggered left starts — everything else identical</div>
  <svg viewBox="0 0 520 400">
    <g fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 96 H206 C258 96,252 146,318 152 C362 156,380 144,404 142 Q426 141,426 156 V172" stroke="url(#gA)"/>
      <path d="M95 148 H238 C272 148,278 160,306 176" stroke="url(#gB)"/>
      <path d="M175 200 H288" stroke="url(#gC)"/>
      <path d="M115 252 H238 C272 252,278 240,306 224" stroke="url(#gD)"/>
      <path d="M135 304 H206 C258 304,252 254,318 248 C362 244,380 256,404 258 Q426 259,426 244 V228" stroke="url(#gE)"/>
    </g>
    <polygon points="288,174 350,200 288,226" fill="#818cf8"/>
    <circle cx="474" cy="200" r="27" fill="#34d399"/>
  </svg>
</div>

<!-- ════════ 3 · CHANGE 1 + 2 — staggered starts + shape heads ════════ -->
<div class="card">
  <div class="tag">3 · + basic shape at each line head</div>
  <svg viewBox="0 0 520 400">
    <g fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 96 H206 C258 96,252 146,318 152 C362 156,380 144,404 142 Q426 141,426 156 V172" stroke="url(#gA)"/>
      <path d="M95 148 H238 C272 148,278 160,306 176" stroke="url(#gB)"/>
      <path d="M175 200 H288" stroke="url(#gC)"/>
      <path d="M115 252 H238 C272 252,278 240,306 224" stroke="url(#gD)"/>
      <path d="M135 304 H206 C258 304,252 254,318 248 C362 244,380 256,404 258 Q426 259,426 244 V228" stroke="url(#gE)"/>
    </g>
    <polygon points="288,174 350,200 288,226" fill="#818cf8"/>
    <circle cx="474" cy="200" r="27" fill="#34d399"/>
    <!-- shape heads: triangle=code · square=infra · circle=data · diamond=framework · hexagon=agents -->
    <polygon points="104,82 104,110 130,96" fill="#2dd4bf"/>
    <rect x="49" y="134" width="28" height="28" rx="4" fill="#38bdf8"/>
    <circle cx="141" cy="200" r="15" fill="#6366f1"/>
    <polygon points="69,235 86,252 69,269 52,252" fill="#6366f1"/>
    <polygon points="81,290 97,290 105,304 97,318 81,318 73,304" fill="#8b5cf6"/>
  </svg>
</div>

</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0f0e24"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>

  <!-- Stars -->
  <circle cx="95" cy="60" r="0.7" fill="#fff" opacity="0.12"/>
  <circle cx="310" cy="45" r="0.5" fill="#fff" opacity="0.08"/>
  <circle cx="890" cy="50" r="0.6" fill="#fff" opacity="0.1"/>
  <circle cx="1150" cy="90" r="0.5" fill="#fff" opacity="0.07"/>
  <circle cx="1200" cy="400" r="0.4" fill="#fff" opacity="0.06"/>
  <circle cx="70" cy="420" r="0.5" fill="#fff" opacity="0.07"/>
  <circle cx="200" cy="200" r="0.4" fill="#fff" opacity="0.06"/>
  <circle cx="1100" cy="180" r="0.5" fill="#fff" opacity="0.08"/>

  <!-- ===== CONSTELLATION WEB - A living network of everything connected ===== -->

  <!-- Outer ring nodes (orbit 1 - r~200) -->
  <circle cx="640" cy="80" r="5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="810" cy="120" r="4" fill="#22d3ee" opacity="0.45"/>
  <circle cx="920" cy="220" r="5" fill="#34d399" opacity="0.45"/>
  <circle cx="920" cy="360" r="4" fill="#f59e0b" opacity="0.4"/>
  <circle cx="810" cy="450" r="5" fill="#818cf8" opacity="0.45"/>
  <circle cx="640" cy="490" r="4" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="470" cy="450" r="5" fill="#22d3ee" opacity="0.45"/>
  <circle cx="360" cy="360" r="4" fill="#a78bfa" opacity="0.4"/>
  <circle cx="360" cy="220" r="5" fill="#f59e0b" opacity="0.45"/>
  <circle cx="470" cy="120" r="4" fill="#34d399" opacity="0.4"/>

  <!-- Middle ring nodes (orbit 2 - r~120) -->
  <circle cx="640" cy="160" r="6" fill="#a78bfa" opacity="0.55"/>
  <circle cx="745" cy="195" r="5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="790" cy="290" r="6" fill="#34d399" opacity="0.5"/>
  <circle cx="745" cy="385" r="5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="640" cy="420" r="6" fill="#818cf8" opacity="0.5"/>
  <circle cx="535" cy="385" r="5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="490" cy="290" r="6" fill="#22d3ee" opacity="0.5"/>
  <circle cx="535" cy="195" r="5" fill="#34d399" opacity="0.5"/>

  <!-- Inner ring nodes (orbit 3 - r~60) -->
  <circle cx="640" cy="230" r="5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="692" cy="260" r="5" fill="#22d3ee" opacity="0.6"/>
  <circle cx="692" cy="320" r="5" fill="#34d399" opacity="0.6"/>
  <circle cx="640" cy="350" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="588" cy="320" r="5" fill="#818cf8" opacity="0.6"/>
  <circle cx="588" cy="260" r="5" fill="#c4b5fd" opacity="0.6"/>

  <!-- === CONNECTIONS between rings - the harmony === -->
  <!-- Outer to middle connections -->
  <line x1="640" y1="80" x2="640" y2="160" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="810" y1="120" x2="745" y2="195" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="920" y1="220" x2="790" y2="290" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="920" y1="360" x2="745" y2="385" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.16"/>
  <line x1="810" y1="450" x2="640" y2="420" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="640" y1="490" x2="535" y2="385" stroke="#c4b5fd" stroke-width="0.7" stroke-opacity="0.16"/>
  <line x1="470" y1="450" x2="490" y2="290" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.16"/>
  <line x1="360" y1="360" x2="490" y2="290" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.16"/>
  <line x1="360" y1="220" x2="535" y2="195" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="470" y1="120" x2="535" y2="195" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.18"/>

  <!-- Middle to inner connections -->
  <line x1="640" y1="160" x2="640" y2="230" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="745" y1="195" x2="692" y2="260" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="790" y1="290" x2="692" y2="320" stroke="#34d399" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="745" y1="385" x2="640" y2="350" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="640" y1="420" x2="588" y2="320" stroke="#818cf8" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="535" y1="385" x2="588" y2="320" stroke="#c4b5fd" stroke-width="0.9" stroke-opacity="0.2"/>
  <line x1="490" y1="290" x2="588" y2="260" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="535" y1="195" x2="640" y2="230" stroke="#34d399" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Cross connections in middle ring - everything talks to everything -->
  <line x1="640" y1="160" x2="745" y2="195" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="745" y1="195" x2="790" y2="290" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="790" y1="290" x2="745" y2="385" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="745" y1="385" x2="640" y2="420" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="640" y1="420" x2="535" y2="385" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="535" y1="385" x2="490" y2="290" stroke="#c4b5fd" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="490" y1="290" x2="535" y2="195" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="535" y1="195" x2="640" y2="160" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.08"/>
  <!-- Diagonals -->
  <line x1="640" y1="160" x2="790" y2="290" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.05"/>
  <line x1="640" y1="160" x2="490" y2="290" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.05"/>
  <line x1="745" y1="195" x2="535" y2="385" stroke="#22d3ee" stroke-width="0.4" stroke-opacity="0.05"/>
  <line x1="790" y1="290" x2="535" y2="195" stroke="#34d399" stroke-width="0.4" stroke-opacity="0.05"/>
  <line x1="640" y1="420" x2="490" y2="290" stroke="#818cf8" stroke-width="0.4" stroke-opacity="0.05"/>
  <line x1="745" y1="385" x2="490" y2="290" stroke="#f59e0b" stroke-width="0.4" stroke-opacity="0.05"/>

  <!-- Inner ring cross connections -->
  <line x1="640" y1="230" x2="692" y2="260" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="692" y1="260" x2="692" y2="320" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="692" y1="320" x2="640" y2="350" stroke="#34d399" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="640" y1="350" x2="588" y2="320" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="588" y1="320" x2="588" y2="260" stroke="#818cf8" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="588" y1="260" x2="640" y2="230" stroke="#c4b5fd" stroke-width="0.7" stroke-opacity="0.12"/>
  <!-- Inner diagonals -->
  <line x1="640" y1="230" x2="692" y2="320" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="640" y1="230" x2="588" y2="320" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="692" y1="260" x2="640" y2="350" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="692" y1="260" x2="588" y2="320" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="588" y1="260" x2="692" y2="320" stroke="#c4b5fd" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="588" y1="260" x2="640" y2="350" stroke="#c4b5fd" stroke-width="0.5" stroke-opacity="0.07"/>

  <!-- Inner to center -->
  <line x1="640" y1="230" x2="640" y2="290" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="692" y1="260" x2="640" y2="290" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="692" y1="320" x2="640" y2="290" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="640" y1="350" x2="640" y2="290" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="588" y1="320" x2="640" y2="290" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="588" y1="260" x2="640" y2="290" stroke="#c4b5fd" stroke-width="1.2" stroke-opacity="0.2"/>

  <!-- === CENTER CORE === -->
  <circle cx="640" cy="290" r="20" fill="url(#core)"/>
  <circle cx="640" cy="290" r="8" fill="#ffffff" opacity="0.15"/>
  <circle cx="640" cy="290" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Orbit rings -->
  <circle cx="640" cy="290" r="60" fill="none" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.06" stroke-dasharray="3,5"/>
  <circle cx="640" cy="290" r="120" fill="none" stroke="#22d3ee" stroke-width="0.3" stroke-opacity="0.05" stroke-dasharray="4,6"/>
  <circle cx="640" cy="290" r="200" fill="none" stroke="#818cf8" stroke-width="0.3" stroke-opacity="0.03" stroke-dasharray="5,8"/>

  <!-- Faint data sparks traveling along connections -->
  <circle cx="640" cy="120" r="1.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="770" cy="240" r="1.5" fill="#22d3ee" opacity="0.35"/>
  <circle cx="860" cy="330" r="1.5" fill="#34d399" opacity="0.35"/>
  <circle cx="690" cy="410" r="1.5" fill="#f59e0b" opacity="0.35"/>
  <circle cx="510" cy="340" r="1.5" fill="#818cf8" opacity="0.35"/>
  <circle cx="500" cy="240" r="1.5" fill="#c4b5fd" opacity="0.35"/>
  <circle cx="550" cy="150" r="1.5" fill="#34d399" opacity="0.3"/>
  <circle cx="780" cy="440" r="1.5" fill="#818cf8" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="580" text-anchor="middle" font-size="56" font-weight="700" fill="#ffffff" font-family="monospace" letter-spacing="8">The End</text>

  <!-- Subtitle -->
  <text x="640" y="625" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0.3" font-family="monospace" letter-spacing="6">EVERYTHING IS CONNECTED</text>

  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.15" font-family="monospace">stacktic.io</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f0e24"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.4">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismG" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- === CHAOS: Wild, scattered rays converging into the prism from the left === -->
  <!-- Erratic, different angles, different opacities - raw uncontrolled intelligence -->
  <line x1="180" y1="120" x2="520" y2="255" stroke="#a78bfa" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="220" y1="180" x2="520" y2="265" stroke="#c4b5fd" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="160" y1="260" x2="520" y2="275" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="200" y1="310" x2="520" y2="285" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.28"/>
  <line x1="240" y1="370" x2="520" y2="300" stroke="#c4b5fd" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="170" y1="400" x2="520" y2="310" stroke="#818cf8" stroke-width="1.3" stroke-opacity="0.22"/>
  <line x1="260" y1="150" x2="520" y2="260" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="190" y1="340" x2="520" y2="290" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="280" y1="220" x2="520" y2="268" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="230" y1="430" x2="520" y2="320" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.12"/>

  <!-- Scattered particles on the chaotic side -->
  <circle cx="200" cy="140" r="2" fill="#a78bfa" opacity="0.35"/>
  <circle cx="250" cy="200" r="1.5" fill="#c4b5fd" opacity="0.3"/>
  <circle cx="180" cy="280" r="2.5" fill="#818cf8" opacity="0.4"/>
  <circle cx="230" cy="350" r="1.5" fill="#a78bfa" opacity="0.25"/>
  <circle cx="270" cy="170" r="1" fill="#7c3aed" opacity="0.2"/>
  <circle cx="210" cy="390" r="2" fill="#c4b5fd" opacity="0.3"/>
  <circle cx="300" cy="240" r="1" fill="#a78bfa" opacity="0.2"/>
  <circle cx="160" cy="320" r="1.5" fill="#818cf8" opacity="0.25"/>
  <circle cx="250" cy="420" r="1" fill="#a78bfa" opacity="0.15"/>

  <!-- === THE PRISM - triangular, pointing right === -->
  <polygon points="520,180 760,280 520,380" fill="url(#prismG)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Inner refraction lines -->
  <line x1="560" y1="210" x2="720" y2="275" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="560" y1="350" x2="720" y2="285" stroke="#22d3ee" stroke-width="0.4" stroke-opacity="0.08"/>
  <!-- Subtle inner triangle -->
  <polygon points="570,230 700,280 570,330" fill="none" stroke="#818cf8" stroke-width="0.4" stroke-opacity="0.06"/>

  <!-- Bright point where light exits the prism -->
  <circle cx="760" cy="280" r="6" fill="#ffffff" opacity="0.08"/>
  <circle cx="760" cy="280" r="3" fill="#ffffff" opacity="0.15"/>

  <!-- === ORDER: Perfectly parallel, evenly spaced rays exiting to the right === -->
  <!-- Like a spectrum - each ray clean, disciplined, separated -->
  <line x1="760" y1="280" x2="1100" y2="160" stroke="url(#r1)" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="760" y1="280" x2="1100" y2="220" stroke="url(#r2)" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="760" y1="280" x2="1100" y2="280" stroke="url(#r3)" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="760" y1="280" x2="1100" y2="340" stroke="url(#r4)" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="760" y1="280" x2="1100" y2="400" stroke="url(#r5)" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Clean dots at ray endpoints - precision -->
  <circle cx="1100" cy="160" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle cx="1100" cy="220" r="4" fill="#818cf8" opacity="0.6"/>
  <circle cx="1100" cy="280" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="1100" cy="340" r="4" fill="#34d399" opacity="0.6"/>
  <circle cx="1100" cy="400" r="4" fill="#f59e0b" opacity="0.6"/>

  <!-- Subtle glow behind output rays -->
  <ellipse cx="930" cy="280" rx="180" ry="140" fill="#22d3ee" opacity="0.015"/>

  <!-- Title -->
  <text x="640" y="540" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="monospace" letter-spacing="3">The Discipline of Intelligence</text>

  <!-- Subtitle -->
  <text x="640" y="580" text-anchor="middle" font-size="14" fill="#94a3b8" opacity="0.4" font-family="monospace" letter-spacing="4">AI GOVERNANCE</text>

  <line x1="430" y1="515" x2="850" y2="515" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.15"/>

  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.15" font-family="monospace">stacktic.io</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f0e24"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arc3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.5" fill="#94a3b8" opacity="0.08"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Central circular cycle - the "routine" visualization -->
  <!-- Outer glow -->
  <circle cx="640" cy="320" r="160" fill="#a78bfa" opacity="0.02"/>
  <circle cx="640" cy="320" r="140" fill="#7c3aed" opacity="0.02"/>

  <!-- Three rotating orbit rings representing the 360 cycle -->
  <!-- Ring 1 - Plan/Build (purple) -->
  <circle cx="640" cy="320" r="130" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.12"/>
  <path d="M 640 190 A 130 130 0 0 1 752.6 255" fill="none" stroke="url(#arc1)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Dot on arc -->
  <circle cx="752" cy="255" r="5" fill="#a78bfa" opacity="0.9"/>

  <!-- Ring 2 - Deploy/Configure (cyan) -->
  <circle cx="640" cy="320" r="105" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.1"/>
  <path d="M 745 320 A 105 105 0 0 1 640 425" fill="none" stroke="url(#arc2)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="640" cy="425" r="5" fill="#22d3ee" opacity="0.9"/>

  <!-- Ring 3 - Monitor/Heal (green) -->
  <circle cx="640" cy="320" r="80" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.1"/>
  <path d="M 560 320 A 80 80 0 0 1 640 240" fill="none" stroke="url(#arc3)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="640" cy="240" r="5" fill="#34d399" opacity="0.9"/>

  <!-- Center icon - infinity/cycle symbol -->
  <text x="640" y="330" text-anchor="middle" font-size="36" fill="#ffffff" opacity="0.15" font-family="monospace">360</text>

  <!-- Phase labels around the cycle -->
  <text x="780" y="230" text-anchor="start" font-size="11" fill="#a78bfa" opacity="0.5" font-family="monospace">plan</text>
  <text x="790" y="380" text-anchor="start" font-size="11" fill="#22d3ee" opacity="0.5" font-family="monospace">deploy</text>
  <text x="620" y="470" text-anchor="end" font-size="11" fill="#22d3ee" opacity="0.5" font-family="monospace">configure</text>
  <text x="480" y="380" text-anchor="end" font-size="11" fill="#34d399" opacity="0.5" font-family="monospace">monitor</text>
  <text x="480" y="260" text-anchor="end" font-size="11" fill="#34d399" opacity="0.5" font-family="monospace">heal</text>
  <text x="690" y="180" text-anchor="start" font-size="11" fill="#a78bfa" opacity="0.5" font-family="monospace">build</text>

  <!-- Small connecting dots between phases -->
  <circle cx="770" cy="240" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="790" cy="370" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="630" cy="455" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="495" cy="370" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="495" cy="250" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="680" cy="185" r="2" fill="#a78bfa" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="580" text-anchor="middle" font-size="52" font-weight="700" fill="#ffffff" font-family="monospace" letter-spacing="6">The Stable Routine</text>

  <!-- Subtitle -->
  <text x="640" y="620" text-anchor="middle" font-size="14" fill="#94a3b8" opacity="0.4" font-family="monospace" letter-spacing="4">360 OPS AUTOMATION</text>

  <!-- Thin decorative line -->
  <line x1="520" y1="555" x2="760" y2="555" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- stacktic.io -->
  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.15" font-family="monospace">stacktic.io</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacktic Video Background v3 — Security</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Fira Code', monospace; background: #060612; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0, frame = 0, vis = true;

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var purple = '#a78bfa', cyan = '#22d3ee', green = '#34d399', yellow = '#fbbf24';
  var indigo = '#818cf8', red = '#f87171', orange = '#fb923c';
  var dim = '#94a3b8', white = '#e2e8f0';

  function roundRect(x,y,w,h,r) {
    if (w<1||h<1) return;
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function resize() {
    W = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0, 800);
    H = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0, 600);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ── Security layers ──
  var secLayers = [
    { name: 'Network Policies', sub: 'Microsegmentation', color: cyan, icon: '\u2B21' },
    { name: 'RBAC', sub: '3-Layer Permissions', color: green, icon: '\u26BF' },
    { name: 'OPA Gatekeeper', sub: 'Policy Enforcement', color: indigo, icon: '\u229E' },
    { name: 'Secrets (SOPS)', sub: 'Encryption', color: yellow, icon: '\u2689' },
    { name: 'API Gateway', sub: 'mTLS / OIDC', color: red, icon: '\u2B22' },
    { name: 'CVE / SBOM', sub: 'Vulnerability Scan', color: orange, icon: '\u26A0' }
  ];

  // ── Security events (scrolling log) ──
  var secEvents = [
    { msg: '[OPA] deny: container running as root', color: red },
    { msg: '[RBAC] grant: fastapi \u2192 mongodb (read)', color: green },
    { msg: '[NetPol] allow: ns:app \u2192 ns:data', color: cyan },
    { msg: '[SOPS] encrypted: db-credentials.yaml', color: yellow },
    { msg: '[CVE] scan: 0 critical, 2 medium', color: orange },
    { msg: '[mTLS] cert rotated: apisix-gateway', color: purple },
    { msg: '[OPA] allow: resource-quota within limit', color: green },
    { msg: '[RBAC] deny: anonymous \u2192 admin-api', color: red },
    { msg: '[NetPol] block: external \u2192 ns:data', color: red },
    { msg: '[SBOM] generated: stack-v3 manifest', color: cyan },
    { msg: '[SOPS] rotated: api-keys.enc.yaml', color: yellow },
    { msg: '[CVE] patched: log4j-2.17.1 \u2192 2.20.0', color: green }
  ];

  // ── Compliance gauges ──
  var compGauges = [
    { label: 'PCI-DSS', pct: 78, color: yellow },
    { label: 'HIPAA', pct: 88, color: green },
    { label: 'SOC2', pct: 92, color: cyan },
    { label: 'CIS', pct: 85, color: indigo }
  ];

  // ── Particles ──
  var particles = [];
  for (var i = 0; i < 70; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      s: 0.6 + Math.random() * 2,
      ph: Math.random() * Math.PI * 2,
      vy: -0.0003 - Math.random() * 0.0007,
      vx: (Math.random() - 0.5) * 0.0003,
      color: [cyan, green, purple, indigo, yellow][Math.floor(Math.random() * 5)]
    });
  }

  // ── Hex grid nodes for security mesh ──
  var meshNodes = [];
  for (var i = 0; i < 24; i++) {
    var angle = (i / 24) * Math.PI * 2;
    var dist = 0.15 + (i % 3) * 0.1;
    meshNodes.push({
      baseX: 0.5 + Math.cos(angle) * dist,
      baseY: 0.5 + Math.sin(angle) * dist,
      x: 0, y: 0,
      ph: Math.random() * Math.PI * 2,
      orbitR: 0.003 + Math.random() * 0.006,
      orbitSpeed: 0.002 + Math.random() * 0.004,
      color: [cyan, green, indigo][Math.floor(Math.random() * 3)]
    });
  }
  var meshEdges = [];
  for (var a = 0; a < meshNodes.length; a++) {
    for (var b = a + 1; b < meshNodes.length; b++) {
      var dx = meshNodes[a].baseX - meshNodes[b].baseX;
      var dy = meshNodes[a].baseY - meshNodes[b].baseY;
      if (Math.sqrt(dx*dx+dy*dy) < 0.17) meshEdges.push({a:a, b:b});
    }
  }

  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() { vis = !document.hidden; if (vis) animate(); });

  function drawShield(cx, cy, size, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size * 0.5);
    ctx.quadraticCurveTo(cx + size * 0.45, cy - size * 0.42, cx + size * 0.45, cy - size * 0.08);
    ctx.quadraticCurveTo(cx + size * 0.4, cy + size * 0.25, cx, cy + size * 0.5);
    ctx.quadraticCurveTo(cx - size * 0.4, cy + size * 0.25, cx - size * 0.45, cy - size * 0.08);
    ctx.quadraticCurveTo(cx - size * 0.45, cy - size * 0.42, cx, cy - size * 0.5);
    ctx.closePath();
    ctx.strokeStyle = rgba(cyan, 0.5); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = rgba(indigo, 0.06); ctx.fill();

    // Checkmark inside
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.12, cy);
    ctx.lineTo(cx - size * 0.02, cy + size * 0.12);
    ctx.lineTo(cx + size * 0.15, cy - size * 0.1);
    ctx.strokeStyle = rgba(green, 0.4); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    frame++;
    var cx = W / 2, cy = H / 2;

    // ═══════════════════
    //  BACKGROUND
    // ═══════════════════
    var vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    vig.addColorStop(0, '#0e0d25');
    vig.addColorStop(0.5, '#080818');
    vig.addColorStop(1, '#030306');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Dot grid
    ctx.fillStyle = rgba(indigo, 0.08);
    for (var dx = 20; dx < W; dx += 45) {
      for (var dy = 20; dy < H; dy += 45) {
        ctx.beginPath(); ctx.arc(dx, dy, 0.8, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ═══════════════════
    //  SECURITY MESH (center background)
    // ═══════════════════
    for (var ei = 0; ei < meshEdges.length; ei++) {
      var e = meshEdges[ei];
      var na = meshNodes[e.a], nb = meshNodes[e.b];
      var eA = 0.08 + Math.sin(frame * 0.01 + ei * 0.5) * 0.04;
      ctx.beginPath();
      ctx.moveTo(na.x * W, na.y * H);
      ctx.lineTo(nb.x * W, nb.y * H);
      ctx.strokeStyle = rgba(cyan, eA); ctx.lineWidth = 0.8; ctx.stroke();

      if (ei % 3 === 0) {
        var st = ((frame * 0.006 + ei * 0.15) % 1);
        var spx = na.x*W + (nb.x*W - na.x*W) * st;
        var spy = na.y*H + (nb.y*H - na.y*H) * st;
        var sg = ctx.createRadialGradient(spx, spy, 0, spx, spy, 6);
        sg.addColorStop(0, rgba(cyan, 0.4));
        sg.addColorStop(1, 'transparent');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(spx, spy, 6, 0, Math.PI*2); ctx.fill();
      }
    }

    for (var ni = 0; ni < meshNodes.length; ni++) {
      var n = meshNodes[ni];
      n.x = n.baseX + Math.cos(frame * n.orbitSpeed + n.ph) * n.orbitR;
      n.y = n.baseY + Math.sin(frame * n.orbitSpeed + n.ph) * n.orbitR;
      var nA = 0.2 + Math.sin(frame * 0.02 + n.ph) * 0.1;
      ctx.beginPath(); ctx.arc(n.x * W, n.y * H, 3, 0, Math.PI * 2);
      ctx.fillStyle = rgba(n.color, nA + 0.15); ctx.fill();
      var ng = ctx.createRadialGradient(n.x*W, n.y*H, 0, n.x*W, n.y*H, 12);
      ng.addColorStop(0, rgba(n.color, nA * 0.35));
      ng.addColorStop(1, 'transparent');
      ctx.fillStyle = ng;
      ctx.beginPath(); ctx.arc(n.x*W, n.y*H, 12, 0, Math.PI*2); ctx.fill();
    }

    // ═══════════════════
    //  CENTRAL SHIELD
    // ═══════════════════
    var shieldPulse = 0.15 + Math.sin(frame * 0.01) * 0.05;
    drawShield(cx, cy, Math.min(W, H) * 0.15, shieldPulse);

    // ═══════════════════
    //  SECURITY LAYERS (left side, stacked cards)
    // ═══════════════════
    var layerW = 180, layerH = 32;
    var layerX = W * 0.04;
    var layerStartY = H * 0.15;
    var layerGap = 50;

    for (var li = 0; li < secLayers.length; li++) {
      var sl = secLayers[li];
      var ly = layerStartY + li * layerGap;
      var drift = Math.sin(frame * 0.005 + li * 0.9) * 6;
      var pulse = 0.5 + Math.sin(frame * 0.015 + li * 1.2) * 0.15;

      ctx.save(); ctx.globalAlpha = 0.4 * pulse;

      // Card
      roundRect(layerX, ly + drift, layerW, layerH, 8);
      ctx.fillStyle = rgba('#0f0e24', 0.8); ctx.fill();
      ctx.strokeStyle = rgba(sl.color, 0.4); ctx.lineWidth = 1.5; ctx.stroke();

      // Top accent
      ctx.beginPath();
      ctx.moveTo(layerX + 8, ly + drift);
      ctx.lineTo(layerX + layerW - 8, ly + drift);
      ctx.strokeStyle = rgba(sl.color, 0.6); ctx.lineWidth = 2; ctx.stroke();

      // Icon
      ctx.font = '600 14px "Fira Code", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(sl.color, 0.8);
      ctx.fillText(sl.icon, layerX + 10, ly + drift + layerH/2);

      // Name
      ctx.font = '600 10px "Fira Code", monospace';
      ctx.fillStyle = rgba(white, 0.85);
      ctx.fillText(sl.name, layerX + 30, ly + drift + layerH * 0.38);

      // Sub
      ctx.font = '400 8px "Fira Code", monospace';
      ctx.fillStyle = rgba(sl.color, 0.6);
      ctx.fillText(sl.sub, layerX + 30, ly + drift + layerH * 0.72);

      // Status dot
      var dotPulse = 0.5 + Math.sin(frame * 0.04 + li) * 0.4;
      ctx.beginPath(); ctx.arc(layerX + layerW - 16, ly + drift + layerH/2, 4, 0, Math.PI*2);
      ctx.fillStyle = rgba(green, dotPulse + 0.2); ctx.fill();

      ctx.restore();
    }

    // ═══════════════════
    //  COMPLIANCE GAUGES (right side)
    // ═══════════════════
    var gaugeR = 28;
    var gaugeX = W * 0.92;
    var gaugeStartY = H * 0.15;
    var gaugeGap = 80;

    for (var gi = 0; gi < compGauges.length; gi++) {
      var g = compGauges[gi];
      var gy = gaugeStartY + gi * gaugeGap;
      var gPulse = 0.5 + Math.sin(frame * 0.012 + gi * 1.5) * 0.15;

      ctx.save(); ctx.globalAlpha = 0.45 * gPulse;

      // Background ring
      ctx.beginPath();
      ctx.arc(gaugeX, gy, gaugeR, -Math.PI * 0.5, Math.PI * 1.5);
      ctx.strokeStyle = rgba('#334155', 0.5);
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();

      // Progress ring
      var angle = (g.pct / 100) * Math.PI * 2;
      var wobble = Math.sin(frame * 0.02 + gi * 2) * 0.02;
      ctx.beginPath();
      ctx.arc(gaugeX, gy, gaugeR, -Math.PI * 0.5, -Math.PI * 0.5 + angle + wobble);
      ctx.strokeStyle = g.color;
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();

      // Glowing tip
      var tipA = -Math.PI * 0.5 + angle + wobble;
      var tx = gaugeX + Math.cos(tipA) * gaugeR;
      var ty = gy + Math.sin(tipA) * gaugeR;
      var tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 8);
      tg.addColorStop(0, rgba(g.color, 0.6));
      tg.addColorStop(1, 'transparent');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.arc(tx, ty, 8, 0, Math.PI*2); ctx.fill();

      // Percentage
      ctx.font = '700 14px "Fira Code", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(white, 0.9);
      ctx.fillText(g.pct + '%', gaugeX, gy - 1);

      // Label
      ctx.font = '600 9px "Fira Code", monospace';
      ctx.fillStyle = rgba(g.color, 0.8);
      ctx.fillText(g.label, gaugeX, gy + gaugeR + 14);

      ctx.restore();
    }

    // ═══════════════════
    //  SECURITY LOG (bottom, scrolling)
    // ═══════════════════
    var logH = 140;
    var logY = H - logH - 10;
    var logW = W * 0.55;
    var logX = cx - logW / 2;

    ctx.save(); ctx.globalAlpha = 0.35;

    // Log background
    roundRect(logX, logY, logW, logH, 10);
    ctx.fillStyle = rgba('#0a0a1a', 0.85); ctx.fill();
    ctx.strokeStyle = rgba(cyan, 0.15); ctx.lineWidth = 1; ctx.stroke();

    // Header
    roundRect(logX, logY, logW, 22, 10);
    ctx.fillStyle = rgba('#111128', 0.9); ctx.fill();
    ctx.fillRect(logX, logY + 12, logW, 10);

    // Header dots
    var hdots = ['#ef4444','#fbbf24','#10b981'];
    for (var di = 0; di < 3; di++) {
      ctx.beginPath(); ctx.arc(logX + logW - 40 + di * 14, logY + 11, 4, 0, Math.PI*2);
      ctx.fillStyle = hdots[di]; ctx.fill();
    }

    ctx.font = '600 9px "Fira Code", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(indigo, 0.8);
    ctx.fillText('SECURITY LOG', logX + 12, logY + 11);

    // Log entries (scrolling)
    ctx.save();
    ctx.beginPath();
    ctx.rect(logX + 4, logY + 24, logW - 8, logH - 28);
    ctx.clip();

    var lineH = 16;
    var scrollOffset = (frame * 0.3) % (secEvents.length * lineH);

    for (var si = 0; si < secEvents.length * 2; si++) {
      var ev = secEvents[si % secEvents.length];
      var ey = logY + 30 + si * lineH - scrollOffset;
      if (ey < logY + 18 || ey > logY + logH) continue;

      ctx.font = '400 9px "Fira Code", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(ev.color, 0.75);
      ctx.fillText(ev.msg, logX + 12, ey);
    }

    ctx.restore(); // clip
    ctx.restore(); // alpha

    // ═══════════════════
    //  PARTICLES
    // ═══════════════════
    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -0.03) { p.y = 1.03; p.x = Math.random(); }
      if (p.x < -0.03) p.x = 1.03;
      if (p.x > 1.03) p.x = -0.03;
      var pa = 0.25 + Math.sin(frame * 0.015 + p.ph) * 0.12;
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.s, 0, Math.PI*2);
      ctx.fillStyle = rgba(p.color, pa); ctx.fill();
    }

    // ═══════════════════
    //  PULSE WAVES
    // ═══════════════════
    for (var pw = 0; pw < 2; pw++) {
      var pPhase = ((frame + pw * 120) % 240) / 240;
      if (pPhase < 0.7) {
        var pR = pPhase * Math.max(W, H) * 0.8;
        var pA = (1 - pPhase / 0.7) * 0.1;
        ctx.beginPath(); ctx.arc(cx, cy, pR, 0, Math.PI * 2);
        ctx.strokeStyle = rgba([cyan, green][pw], pA);
        ctx.lineWidth = 1.5; ctx.stroke();
      }
    }

    // ═══════════════════
    //  SCAN LINE
    // ═══════════════════
    var scanY = ((frame * 0.6) % (H + 80)) - 40;
    ctx.beginPath(); ctx.moveTo(0, scanY); ctx.lineTo(W, scanY);
    ctx.strokeStyle = rgba(green, 0.12); ctx.lineWidth = 1; ctx.stroke();
    var scanGrad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
    scanGrad.addColorStop(0, 'transparent');
    scanGrad.addColorStop(0.5, rgba(green, 0.05));
    scanGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = scanGrad;
    ctx.fillRect(0, scanY - 20, W, 40);

    // ═══════════════════
    //  CORNER BRACKETS
    // ═══════════════════
    var brA = 0.25 + Math.sin(frame * 0.012) * 0.08;
    var brLen = 50, brOff = 18;
    ctx.strokeStyle = rgba(cyan, brA); ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(brOff, brOff+brLen); ctx.lineTo(brOff, brOff); ctx.lineTo(brOff+brLen, brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, brOff); ctx.lineTo(W-brOff, brOff); ctx.lineTo(W-brOff, brOff+brLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(brOff, H-brOff-brLen); ctx.lineTo(brOff, H-brOff); ctx.lineTo(brOff+brLen, H-brOff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-brOff-brLen, H-brOff); ctx.lineTo(W-brOff, H-brOff); ctx.lineTo(W-brOff, H-brOff-brLen); ctx.stroke();

    // ═══════════════════
    //  WATERMARK
    // ═══════════════════
    var wmA = 0.06 + Math.sin(frame * 0.006) * 0.02;
    ctx.save(); ctx.globalAlpha = wmA;
    ctx.font = '700 ' + Math.min(W * 0.05, 60) + 'px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var wg = ctx.createLinearGradient(cx - W*0.12, cy, cx + W*0.12, cy);
    wg.addColorStop(0, cyan); wg.addColorStop(0.5, green); wg.addColorStop(1, indigo);
    ctx.fillStyle = wg;
    ctx.fillText('STACKTIC', cx, cy);
    ctx.restore();

    // Top badge
    ctx.save(); ctx.globalAlpha = 0.35;
    roundRect(cx - 120, 14, 240, 26, 13);
    ctx.fillStyle = rgba('#0f0e24', 0.8); ctx.fill();
    ctx.strokeStyle = rgba(green, 0.3); ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '500 10px "Fira Code", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(green, 0.8);
    ctx.fillText('\u26BF  security & governance  \u26BF', cx, 27);
    ctx.restore();

    // Brand
    ctx.save(); ctx.globalAlpha = 0.25;
    ctx.font = '400 10px "Fira Code", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = rgba(dim, 0.6);
    ctx.fillText('stacktic.io', W - 24, H - 12);
    ctx.restore();
  }

  function animate() {
    if (!vis) return;
    draw();
    requestAnimationFrame(animate);
  }

  if (document.readyState === 'complete') { resize(); animate(); }
  else { window.addEventListener('load', function() { resize(); animate(); }); }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>IT Sovereignty - The Complexity Challenge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=DM+Serif+Display&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1440px;height:810px;overflow:hidden;font-family:'DM Sans',sans-serif;background:#0a0e1a}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="2880" height="1620"></canvas>
<script>
const C=document.getElementById('c');
C.style.width='1440px';C.style.height='810px';
const X=C.getContext('2d');
const W=2880,H=1620;

function easeOutExpo(t){return t===1?1:1-Math.pow(2,-10*t)}
function easeOutBack(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function easeOutElastic(t){if(t===0||t===1)return t;return Math.pow(2,-10*t)*Math.sin((t-0.075)*2*Math.PI/0.3)+1}
function clamp01(t){return Math.max(0,Math.min(1,t))}
function lerp(a,b,t){return a+(b-a)*t}
function tt(now,from,to){return clamp01((now-from)/(to-from))}

// ─── Open Source Tools (logos as colored circles with icons) ───
const tools = [
  {name:'CRM',          icon:'CRM',     color:'#ef4444', cat:'Business'},
  {name:'ERP',          icon:'ERP',     color:'#f97316', cat:'Business'},
  {name:'Email',        icon:'@',       color:'#06b6d4', cat:'Business'},
  {name:'Docs',         icon:'DOC',     color:'#8b5cf6', cat:'Business'},
  {name:'Chat',         icon:'MSG',     color:'#3b82f6', cat:'Business'},
  {name:'Video',        icon:'CAM',     color:'#22d3ee', cat:'Business'},
  {name:'File Storage',  icon:'S3',      color:'#10b981', cat:'Infrastructure'},
  {name:'Database',     icon:'DB',      color:'#a855f7', cat:'Infrastructure'},
  {name:'Cache',        icon:'$',       color:'#ec4899', cat:'Infrastructure'},
  {name:'API Gateway',  icon:'GW',      color:'#f43f5e', cat:'Infrastructure'},
  {name:'SSO / Auth',   icon:'SSO',     color:'#6366f1', cat:'Infrastructure'},
  {name:'Certificates', icon:'TLS',     color:'#14b8a6', cat:'Infrastructure'},
  {name:'Monitoring',   icon:'MON',     color:'#f59e0b', cat:'Operations'},
  {name:'Logging',      icon:'LOG',     color:'#84cc16', cat:'Operations'},
  {name:'Backup',       icon:'BAK',     color:'#64748b', cat:'Operations'},
  {name:'DNS',          icon:'DNS',     color:'#0ea5e9', cat:'Operations'},
  {name:'AI / LLM',     icon:'AI',      color:'#d946ef', cat:'AI'},
  {name:'Vector DB',    icon:'VDB',     color:'#f472b6', cat:'AI'},
  {name:'Automation',   icon:'BOT',     color:'#fb923c', cat:'AI'},
  {name:'Analytics',    icon:'BI',      color:'#818cf8', cat:'Business'},
];

// place in a organic cluster centered on screen
const cx=W/2, cy=H/2-60;
function placeTools(){
  const total = tools.length;
  // spiral placement
  tools.forEach((t,i)=>{
    const angle = i * 0.85 + Math.PI/4;
    const radius = 200 + i * 28;
    t.x = cx + Math.cos(angle) * radius;
    t.y = cy + Math.sin(angle) * radius;
    t.r = 42;
    t.baseX = t.x;
    t.baseY = t.y;
  });
}
placeTools();

// ─── Links between tools ───
const connections = [];
for(let i=0;i<tools.length;i++){
  for(let j=i+1;j<tools.length;j++){
    const dx=tools[i].baseX-tools[j].baseX, dy=tools[i].baseY-tools[j].baseY;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d < 500) connections.push([i,j]);
  }
}

// ─── Operational challenges ───
const challenges = [
  {icon:'🔧', text:'DEPLOY & CONFIGURE', sub:'Helm charts, manifests, secrets for every tool'},
  {icon:'🔗', text:'INTEGRATE', sub:'SSO, DNS, TLS, routing between all components'},
  {icon:'🔒', text:'SECURE', sub:'RBAC, network policies, encryption, compliance'},
  {icon:'📦', text:'VERSION & UPDATE', sub:'Coordinated upgrades across the entire stack'},
  {icon:'📊', text:'MONITOR & OPERATE', sub:'Alerts, dashboards, logs for every component'},
  {icon:'💾', text:'BACKUP & RECOVER', sub:'Automated backups, disaster recovery, testing'},
];

// ─── Animation phases ───
// Phase 1 (0-4s):    Tools appear one by one, fast
// Phase 2 (3-7s):    Connections draw rapidly, web of complexity
// Phase 3 (5-8s):    Center counter grows (components, connections, parameters)
// Phase 4 (7-13s):   Challenge cards appear from right
// Phase 5 (12-14s):  Final message

let startTime=0;

function frame(ts){
  if(!startTime) startTime=ts;
  const now=(ts-startTime)/1000;

  X.clearRect(0,0,W,H);

  // ── Background grid dots ──
  X.save();
  X.globalAlpha = 0.04;
  X.fillStyle = '#818cf8';
  for(let gx=40;gx<W;gx+=60) for(let gy=40;gy<H;gy+=60){
    X.beginPath(); X.arc(gx,gy,1.5,0,Math.PI*2); X.fill();
  }
  X.restore();

  // ── Title ──
  const tA = easeOutExpo(tt(now,0,1.2));
  if(tA>0){
    X.save(); X.globalAlpha=tA;
    X.fillStyle='#4f46e5'; X.fillRect(0,0,W,8);
    X.font='400 52px "DM Serif Display"'; X.fillStyle='#94a3b8';
    X.textAlign='left'; X.textBaseline='top';
    X.fillText('Sovereignty means replacing commercial SaaS with', 100, 55);
    X.font='700 56px "DM Sans"'; X.fillStyle='#e2e8f0';
    X.fillText('20+ open-source tools', 100, 120);
    X.font='400 52px "DM Serif Display"'; X.fillStyle='#94a3b8';
    const w20 = X.measureText('20+ open-source tools').width;
    X.save(); X.font='700 56px "DM Sans"';
    const w20b = X.measureText('20+ open-source tools  ').width;
    X.restore();
    X.fillText('that must all work together.', 100 + w20b, 124);
    X.restore();
  }

  // ── Connections (draw before nodes so nodes are on top) ──
  const linkStart=2.5;
  connections.forEach((c,i)=>{
    const lS = linkStart + i*0.06;
    const lA = easeOutExpo(tt(now, lS, lS+0.5)) * 0.2;
    const lP = easeInOutCubic(tt(now, lS, lS+0.4));
    if(lA<=0||lP<=0) return;

    const a=tools[c[0]], b=tools[c[1]];
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/d, ny=dy/d;
    const sx=a.x+nx*a.r, sy=a.y+ny*a.r;
    const ex=a.x+nx*(a.r+(d-a.r-b.r)*lP), ey=a.y+ny*(a.r+(d-a.r-b.r)*lP);

    X.save(); X.globalAlpha=lA;
    X.beginPath(); X.moveTo(sx,sy); X.lineTo(ex,ey);
    const grad=X.createLinearGradient(sx,sy,ex,ey);
    grad.addColorStop(0,a.color+'60'); grad.addColorStop(1,b.color+'60');
    X.strokeStyle=grad; X.lineWidth=1.5; X.stroke();
    X.restore();
  });

  // ── Nodes ──
  const nodeDelay=0.12;
  const nodeStart=0.8;
  tools.forEach((n,i)=>{
    const nS = nodeStart + i*nodeDelay;
    const nA = easeOutExpo(tt(now, nS, nS+0.5));
    const nSc = easeOutBack(tt(now, nS, nS+0.4));
    if(nA<=0) return;

    // gentle float
    n.x = n.baseX + Math.cos(now*0.7+i*1.3)*5;
    n.y = n.baseY + Math.sin(now*0.9+i*0.9)*4;

    X.save();
    X.globalAlpha=nA;
    X.translate(n.x, n.y);
    X.scale(nSc, nSc);

    // glow
    const glow=X.createRadialGradient(0,0,n.r*0.5,0,0,n.r*2);
    glow.addColorStop(0,n.color+'25'); glow.addColorStop(1,n.color+'00');
    X.beginPath(); X.arc(0,0,n.r*2,0,Math.PI*2); X.fillStyle=glow; X.fill();

    // circle
    X.beginPath(); X.arc(0,0,n.r,0,Math.PI*2);
    X.fillStyle=n.color+'18'; X.strokeStyle=n.color+'90'; X.lineWidth=2.5;
    X.fill(); X.stroke();

    // icon text
    X.font='700 22px "DM Sans"'; X.fillStyle=n.color;
    X.textAlign='center'; X.textBaseline='middle';
    X.fillText(n.icon, 0, -2);

    // name
    X.font='600 19px "DM Sans"'; X.fillStyle='#cbd5e1';
    X.textBaseline='top';
    X.fillText(n.name, 0, n.r+8);

    X.restore();
  });

  // ── Challenge cards ──
  const cardStart=6.5;
  const cardW=680, cardH=88, cardGap=14;
  const cardsX=W-cardW-80;
  const cardsY=340;

  challenges.forEach((ch,i)=>{
    const cS = cardStart + i*0.5;
    const cA = easeOutExpo(tt(now, cS, cS+0.8));
    const slideX = lerp(200,0,easeOutExpo(tt(now,cS,cS+0.6)));
    if(cA<=0) return;

    const cy = cardsY + i*(cardH+cardGap);

    X.save();
    X.globalAlpha=cA;
    X.translate(cardsX+slideX, cy);

    // card bg
    X.beginPath();
    X.roundRect(0,0,cardW,cardH,12);
    X.fillStyle='rgba(30,27,75,0.7)';
    X.strokeStyle='rgba(99,102,241,0.25)';
    X.lineWidth=1.5;
    X.fill(); X.stroke();

    // left accent bar
    const accentColors=['#ef4444','#f97316','#8b5cf6','#22d3ee','#f59e0b','#10b981'];
    X.fillStyle=accentColors[i];
    X.beginPath(); X.roundRect(0,0,6,cardH,3); X.fill();

    // number
    X.font='800 38px "DM Sans"';
    X.fillStyle=accentColors[i];
    X.textAlign='center'; X.textBaseline='middle';
    X.fillText(String(i+1).padStart(2,'0'), 50, cardH/2);

    // text
    X.font='700 28px "DM Sans"';
    X.fillStyle='#e2e8f0';
    X.textAlign='left'; X.textBaseline='middle';
    X.fillText(ch.text, 90, cardH/2 - 14);

    X.font='400 20px "DM Sans"';
    X.fillStyle='#64748b';
    X.fillText(ch.sub, 90, cardH/2 + 18);

    X.restore();
  });

  // ── "For EACH tool" multiplier text ──
  const multA = easeOutElastic(tt(now, 10.0, 11.5));
  if(multA > 0){
    X.save();
    X.globalAlpha = multA;

    const mx = cardsX + cardW/2;
    const my = cardsY + challenges.length*(cardH+cardGap) + 60;

    X.font = '700 44px "DM Sans"';
    X.fillStyle = '#f97316';
    X.textAlign = 'center';
    X.textBaseline = 'middle';
    X.fillText('× 20+ tools  =  Operational Nightmare', mx, my);

    // underline
    X.beginPath();
    X.moveTo(mx - 480, my + 28);
    X.lineTo(mx + 480, my + 28);
    X.strokeStyle = '#f97316';
    X.lineWidth = 3;
    X.stroke();

    X.restore();
  }

  // ── Bottom statement ──
  const botA = easeOutExpo(tt(now, 11.5, 13));
  if(botA > 0){
    X.save();
    X.globalAlpha = botA;

    X.fillStyle='rgba(10,14,26,0.95)';
    X.fillRect(0,1470,W,150);
    X.fillStyle='#4f46e5';
    X.fillRect(0,1468,W,4);

    X.font='500 38px "DM Sans"';
    X.fillStyle='#94a3b8';
    X.textAlign='center'; X.textBaseline='middle';
    X.fillText('Without automation, IT sovereignty is a cost-saving strategy that creates an operational burden.', W/2, 1520);

    X.font='700 42px "DM Sans"';
    X.fillStyle='#4f46e5';
    X.fillText('You need a platform that automates the stack.', W/2, 1570);

    X.restore();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

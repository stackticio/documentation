<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacktic — The Dark Open-Source Factory</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Fira Code', monospace;
      background: #2A2847;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 32px 32px 0;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.2s;
    }
    .title {
      font-size: 72px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #60d5ff 35%, #34d399 65%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 20px;
      color: #94a3b8;
      margin-top: 16px;
      font-weight: 400;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
    .subtitle .hl { font-weight: 600; }
    .subtitle .purple { color: #c084fc; }
    .subtitle .cyan { color: #60d5ff; }
    .subtitle .green { color: #34d399; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Canvas (the main visual) ── */
    .canvas-wrap {
      flex: 1;
      position: relative;
      margin: 16px 32px;
      border-radius: 16px;
      background: rgba(20, 18, 40, 0.4);
      border: 1px solid rgba(139, 92, 246, 0.12);
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.5s;
    }
    .canvas-wrap canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* ── Bottom bar ── */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1s;
    }
    .principles {
      display: flex;
      gap: 24px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(139, 92, 246, 0.06);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .pill:hover {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.1);
    }
    .pill-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill.open .pill-dot { background: #c084fc; box-shadow: 0 0 8px rgba(192, 132, 252, 0.5); }
    .pill.open { color: #c084fc; }
    .pill.agnostic .pill-dot { background: #60d5ff; box-shadow: 0 0 8px rgba(96, 213, 255, 0.5); }
    .pill.agnostic { color: #60d5ff; }
    .pill.lights .pill-dot { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.5); }
    .pill.lights { color: #34d399; }
    .pill.governed .pill-dot { background: #fbbf24; box-shadow: 0 0 8px rgba(251, 191, 36, 0.5); }
    .pill.governed { color: #fbbf24; }

    .terminal {
      font-size: 15px;
      color: #34d399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cursor {
      display: inline-block;
      width: 8px; height: 15px;
      background: #34d399;
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .title { font-size: 48px; }
      .principles { flex-wrap: wrap; gap: 10px; }
      .bottom { flex-direction: column; gap: 16px; align-items: flex-start; }
    }
    @media (max-width: 768px) {
      .header { padding: 20px 16px 0; }
      .title { font-size: 36px; }
      .subtitle { font-size: 14px; }
      .canvas-wrap { margin: 12px 16px; }
      .bottom { padding: 0 16px 16px; }
      .pill { font-size: 9px; padding: 6px 10px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">The Dark Open-Source Factory</div>
    <div class="subtitle">
      An open-source dark-factory platform that automates every <span class="hl purple">stack layer</span> and its <span class="hl cyan">operations</span>, with enforced <span class="hl green">relationship control</span> and <span class="hl purple">AI governance</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="factory"></canvas>
  </div>

  <div class="bottom">
    <div class="principles">
      <div class="pill open"><span class="pill-dot"></span>Open Source</div>
      <div class="pill agnostic"><span class="pill-dot"></span>Cloud Agnostic</div>
      <div class="pill lights"><span class="pill-dot"></span>Lights Out</div>
      <div class="pill governed"><span class="pill-dot"></span>Governed</div>
    </div>
    <div class="terminal">
      <span id="term">$ topology in → autonomous out</span>
      <span class="cursor"></span>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const canvas = document.getElementById('factory');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0;
  let visible = true;
  let time = 0;

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    if (r.width === 0) { requestAnimationFrame(resize); return; }
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setTimeout(resize, 50);
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() {
    visible = !document.hidden;
    if (visible) animate();
  });

  // Colors
  const C = {
    purple: '#c084fc', cyan: '#60d5ff', green: '#34d399',
    yellow: '#fbbf24', pink: '#f472b6', white: '#ffffff',
    dim: '#94a3b8'
  };

  function rgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  // ── Factory stages ──
  const stages = [
    { label: 'Topology',     sub: 'design',   color: C.purple, icon: '{ }' },
    { label: 'Generation',   sub: 'assemble', color: C.cyan,   icon: '< >' },
    { label: 'Intelligence', sub: 'feed',     color: C.green,  icon: 'API' },
    { label: 'Governance',   sub: 'control',  color: C.yellow, icon: 'MCP' },
    { label: 'Autonomous',   sub: 'operate',  color: C.pink,   icon: ' AI' },
  ];

  // ── Pipeline particles ──
  class Particle {
    constructor() { this.reset(true); }
    reset(spread) {
      const stageIdx = Math.floor(Math.random() * 5);
      this.color = stages[stageIdx].color;
      this.x = spread ? Math.random() * 1500 : -20;
      this.baseY = 0.5;
      this.y = 0;
      this.speed = 0.4 + Math.random() * 1.2;
      this.size = 2 + Math.random() * 3.5;
      this.wave = Math.random() * Math.PI * 2;
      this.waveAmp = 8 + Math.random() * 25;
      this.waveFreq = 0.008 + Math.random() * 0.012;
    }
    update() {
      this.x += this.speed;
      this.y = this.baseY + Math.sin(this.x * this.waveFreq + this.wave) * this.waveAmp;
      if (this.x > W + 20) this.reset(false);
    }
  }

  const particles = [];
  for (let i = 0; i < 40; i++) particles.push(new Particle());

  // ── Ambient dots ──
  const ambient = [];
  for (let i = 0; i < 30; i++) {
    ambient.push({
      x: Math.random(), y: Math.random(),
      size: 1 + Math.random() * 2,
      speed: 0.002 + Math.random() * 0.003,
      phase: Math.random() * Math.PI * 2
    });
  }

  // ── Draw ──
  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    time++;

    const cy = H * 0.48; // Pipeline center Y
    const pipeY = cy;
    const sx = W * 0.08; // Start X
    const ex = W * 0.92; // End X
    const stageGap = (ex - sx) / 4;
    const nodeR = Math.min(52, W * 0.042);

    // ── Background grid ──
    ctx.strokeStyle = 'rgba(139, 92, 246, 0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // ── Ambient dots ──
    ambient.forEach(a => {
      const pulse = 0.3 + Math.sin(time * 0.02 + a.phase) * 0.3;
      ctx.beginPath();
      ctx.arc(a.x * W, a.y * H, a.size, 0, Math.PI * 2);
      ctx.fillStyle = rgba(C.purple, pulse * 0.3);
      ctx.fill();
    });

    // ── Main pipeline line ──
    const grad = ctx.createLinearGradient(sx, 0, ex, 0);
    grad.addColorStop(0, rgba(C.purple, 0.25));
    grad.addColorStop(0.25, rgba(C.cyan, 0.25));
    grad.addColorStop(0.5, rgba(C.green, 0.25));
    grad.addColorStop(0.75, rgba(C.yellow, 0.25));
    grad.addColorStop(1, rgba(C.pink, 0.25));
    ctx.beginPath();
    ctx.moveTo(sx, pipeY);
    ctx.lineTo(ex, pipeY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Animated shimmer on pipeline
    const shimX = sx + ((time * 2) % (ex - sx + 200)) - 100;
    const shimGrad = ctx.createLinearGradient(shimX - 60, 0, shimX + 60, 0);
    shimGrad.addColorStop(0, 'transparent');
    shimGrad.addColorStop(0.5, 'rgba(255,255,255,0.15)');
    shimGrad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(Math.max(sx, shimX - 60), pipeY);
    ctx.lineTo(Math.min(ex, shimX + 60), pipeY);
    ctx.strokeStyle = shimGrad;
    ctx.lineWidth = 3;
    ctx.stroke();

    // ── Particles flowing along pipeline ──
    particles.forEach(p => {
      p.baseY = pipeY;
      p.update();
      // Glow
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 5);
      g.addColorStop(0, rgba(p.color, 0.4));
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 5, 0, Math.PI * 2);
      ctx.fill();
      // Dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    });

    // ── Stage nodes ──
    stages.forEach((s, i) => {
      const x = sx + stageGap * i;
      const y = pipeY;
      const pulse = 1 + Math.sin(time * 0.03 + i * 1.2) * 0.08;
      const r = nodeR * pulse;

      // Outer glow
      const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
      glow.addColorStop(0, rgba(s.color, 0.12));
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, r * 3, 0, Math.PI * 2);
      ctx.fill();

      // Ring
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      const cg = ctx.createRadialGradient(x - r/3, y - r/3, 0, x, y, r);
      cg.addColorStop(0, rgba(s.color, 0.2));
      cg.addColorStop(1, rgba(s.color, 0.05));
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Icon inside
      ctx.font = '700 ' + Math.max(14, r * 0.4) + 'px "Fira Code", monospace';
      ctx.fillStyle = s.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.icon, x, y);

      // Label below
      ctx.font = '700 ' + Math.max(16, r * 0.45) + 'px "Fira Code", monospace';
      ctx.fillStyle = C.white;
      ctx.textBaseline = 'top';
      ctx.fillText(s.label, x, y + r + 16);

      // Sub-label
      ctx.font = '400 ' + Math.max(12, r * 0.3) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(s.color, 0.7);
      ctx.fillText('// ' + s.sub, x, y + r + 38);

      // Stage number above
      ctx.font = '600 ' + Math.max(12, r * 0.28) + 'px "Fira Code", monospace';
      ctx.fillStyle = rgba(s.color, 0.5);
      ctx.textBaseline = 'bottom';
      ctx.fillText('0' + (i+1), x, y - r - 14);
    });

    // ── Arrow hints between nodes ──
    for (let i = 0; i < 4; i++) {
      const x1 = sx + stageGap * i + nodeR + 8;
      const x2 = sx + stageGap * (i+1) - nodeR - 8;
      const mx = (x1 + x2) / 2;
      const arrowPulse = 0.4 + Math.sin(time * 0.04 + i) * 0.3;
      ctx.font = '400 20px "Fira Code", monospace';
      ctx.fillStyle = rgba(C.green, arrowPulse);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('>', mx, pipeY);
    }

    // ── "INPUT" and "OUTPUT" labels ──
    ctx.font = '600 13px "Fira Code", monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right';
    ctx.fillStyle = rgba(C.purple, 0.5);
    ctx.fillText('INPUT', sx - nodeR - 16, pipeY);
    ctx.textAlign = 'left';
    ctx.fillStyle = rgba(C.pink, 0.5);
    ctx.fillText('OUTPUT', ex + nodeR + 16, pipeY);

    // ── Top-left annotation ──
    ctx.font = '400 12px "Fira Code", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = rgba(C.dim, 0.3);
    ctx.fillText('// dark factory assembly line', 16, 16);

    // ── Bottom center: interface concept ──
    const bcy = H - 60;
    ctx.font = '500 15px "Fira Code", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(C.white, 0.6);
    ctx.fillText('Stacktic is the production interface for AI', W/2, bcy);

    // Four pillars below
    const pillars = [
      { t: 'validated', c: C.green },
      { t: 'production', c: C.cyan },
      { t: 'restricted', c: C.yellow },
      { t: 'error-proof', c: C.pink }
    ];
    const pw = 160;
    const psx = W/2 - (pw * 2);
    ctx.font = '600 13px "Fira Code", monospace';
    pillars.forEach((p, i) => {
      const px = psx + pw * i + pw/2;
      ctx.fillStyle = rgba(p.c, 0.5 + Math.sin(time * 0.03 + i) * 0.2);
      ctx.fillText(p.t, px, bcy + 20);
    });

    // ── Top right: Stacktic logo ──
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.font = '700 12px "Fira Code", monospace';
    ctx.fillStyle = rgba(C.purple, 0.4);
    ctx.fillText('{', W - 90, 16);
    const logoGrad = ctx.createLinearGradient(W - 85, 0, W - 20, 0);
    logoGrad.addColorStop(0, rgba(C.purple, 0.4));
    logoGrad.addColorStop(0.5, rgba(C.cyan, 0.4));
    logoGrad.addColorStop(1, rgba(C.green, 0.4));
    ctx.fillStyle = logoGrad;
    ctx.fillText('Stacktic', W - 30, 16);
    ctx.fillStyle = rgba(C.purple, 0.4);
    ctx.fillText('}', W - 16, 16);
  }

  function animate() {
    if (!visible) return;
    draw();
    requestAnimationFrame(animate);
  }
  animate();

  // ── Terminal typing ──
  const cmds = [
    '$ topology in → autonomous out',
    '$ open-source · cloud-agnostic · lights-out',
    '$ zero kubectl · zero raw access · zero drift',
    '$ mcp tools/list → 50+ governed tools',
    '$ stacktic generate --dark-factory',
  ];
  let ci = 0, chi = 0, del = false, wait = 0;
  (function type() {
    const el = document.getElementById('term');
    if (!el) return;
    const cmd = cmds[ci];
    if (!del) {
      if (chi < cmd.length) { el.textContent = cmd.substring(0, chi+1); chi++; setTimeout(type, 40); }
      else { wait++; if (wait > 50) { del = true; wait = 0; } setTimeout(type, 50); }
    } else {
      if (chi > 0) { chi--; el.textContent = cmd.substring(0, chi); setTimeout(type, 18); }
      else { del = false; ci = (ci+1) % cmds.length; setTimeout(type, 250); }
    }
  })();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacktic Vision - OSS Unification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2a2847;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .universe {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Central unified core */
        .unified-core {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
        }

        .core-mesh {
            width: 100%;
            height: 100%;
            position: absolute;
            background: conic-gradient(
                from 0deg,
                rgba(96, 213, 255, 0.1) 0deg,
                rgba(129, 140, 248, 0.2) 120deg,
                rgba(192, 132, 252, 0.1) 240deg,
                rgba(96, 213, 255, 0.1) 360deg
            );
            border-radius: 50%;
            animation: meshRotate 20s linear infinite;
        }

        .core-mesh::before {
            content: '';
            position: absolute;
            inset: 20px;
            background: radial-gradient(
                circle,
                rgba(52, 211, 153, 0.4) 0%,
                transparent 70%
            );
            border-radius: 50%;
            animation: corePulse 3s ease-in-out infinite;
        }

        @keyframes meshRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* OSS Nodes - representing different open source components */
        .oss-ecosystem {
            position: absolute;
            width: 600px;
            height: 600px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .oss-node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, 
                rgba(96, 213, 255, 0.2), 
                rgba(96, 213, 255, 0.1)
            );
            border: 1px solid rgba(96, 213, 255, 0.5);
            animation: nodeFloat 15s ease-in-out infinite;
        }

        .oss-node::after {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px solid rgba(96, 213, 255, 0.2);
            border-radius: 8px;
            animation: nodePing 3s ease-out infinite;
        }

        @keyframes nodeFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-20px, -20px) scale(1.1); }
            66% { transform: translate(20px, -10px) scale(0.95); }
        }

        @keyframes nodePing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .oss-node:nth-child(1) { top: 10%; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
        .oss-node:nth-child(2) { top: 25%; right: 15%; animation-delay: 0.5s; }
        .oss-node:nth-child(3) { top: 50%; right: 5%; transform: translateY(-50%); animation-delay: 1s; }
        .oss-node:nth-child(4) { top: 75%; right: 15%; animation-delay: 1.5s; }
        .oss-node:nth-child(5) { bottom: 10%; left: 50%; transform: translateX(-50%); animation-delay: 2s; }
        .oss-node:nth-child(6) { top: 75%; left: 15%; animation-delay: 2.5s; }
        .oss-node:nth-child(7) { top: 50%; left: 5%; transform: translateY(-50%); animation-delay: 3s; }
        .oss-node:nth-child(8) { top: 25%; left: 15%; animation-delay: 3.5s; }

        /* Automation flow paths */
        .automation-path {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .flow-stream {
            stroke: none;
            fill: none;
        }

        .flow-particle {
            r: 2;
            fill: #60d5ff;
            filter: blur(0.5px);
        }

        /* Data pipeline visualization */
        .pipeline {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 800px;
            height: 2px;
            transform: translate(-50%, -50%) rotate(-30deg);
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(52, 211, 153, 0.3) 20%,
                rgba(52, 211, 153, 0.5) 50%,
                rgba(52, 211, 153, 0.3) 80%,
                transparent 100%
            );
            animation: pipelineFlow 4s linear infinite;
        }

        .pipeline:nth-child(2) {
            transform: translate(-50%, -50%) rotate(30deg);
            animation-delay: 1.3s;
        }

        .pipeline:nth-child(3) {
            transform: translate(-50%, -50%) rotate(90deg);
            animation-delay: 2.6s;
        }

        @keyframes pipelineFlow {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rotation)) scaleX(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rotation)) scaleX(1); }
        }

        /* Integration mesh */
        .integration-web {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.15;
        }

        .mesh-line {
            stroke: #818cf8;
            stroke-width: 0.5;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawMesh 10s ease-in-out infinite alternate;
        }

        @keyframes drawMesh {
            to { stroke-dashoffset: 0; }
        }

        /* Orbital rings showing continuous integration */
        .ci-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            border: 1px solid;
            opacity: 0.3;
            animation: orbitExpand 6s ease-in-out infinite;
        }

        .ci-ring:nth-child(1) {
            width: 250px;
            height: 250px;
            transform: translate(-50%, -50%);
            border-color: rgba(96, 213, 255, 0.4);
            animation-delay: 0s;
        }

        .ci-ring:nth-child(2) {
            width: 350px;
            height: 350px;
            transform: translate(-50%, -50%);
            border-color: rgba(129, 140, 248, 0.3);
            animation-delay: 2s;
        }

        .ci-ring:nth-child(3) {
            width: 450px;
            height: 450px;
            transform: translate(-50%, -50%);
            border-color: rgba(192, 132, 252, 0.2);
            animation-delay: 4s;
        }

        @keyframes orbitExpand {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 0.3;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1) rotate(180deg);
                opacity: 0.6;
            }
        }

        /* Next-gen standard indicators */
        .standard-beacon {
            position: absolute;
            width: 60px;
            height: 60px;
        }

        .beacon-core {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .beacon-core::before,
        .beacon-core::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid #34d399;
            border-radius: 4px;
            animation: beaconRotate 8s linear infinite;
        }

        .beacon-core::after {
            animation-direction: reverse;
            border-color: rgba(52, 211, 153, 0.3);
            transform: rotate(45deg);
        }

        @keyframes beaconRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .standard-beacon:nth-child(1) { top: 15%; left: 10%; }
        .standard-beacon:nth-child(2) { top: 15%; right: 10%; }
        .standard-beacon:nth-child(3) { bottom: 15%; left: 10%; }
        .standard-beacon:nth-child(4) { bottom: 15%; right: 10%; }

        /* Energy field effect */
        .energy-field {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                transparent 30%,
                rgba(96, 213, 255, 0.05) 50%,
                transparent 70%
            );
            animation: fieldPulse 5s ease-in-out infinite;
        }

        @keyframes fieldPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(90deg); }
        }

        /* Quantum dots representing microservices */
        .quantum-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c084fc;
            border-radius: 50%;
            animation: quantumJump 10s infinite;
        }

        @keyframes quantumJump {
            0%, 100% { 
                opacity: 0;
                transform: scale(0);
            }
            10%, 90% { 
                opacity: 1;
                transform: scale(1);
            }
            50% {
                transform: scale(1) translate(var(--tx), var(--ty));
            }
        }

        /* Subtle grid */
        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(96, 213, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 213, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridSlide 30s linear infinite;
        }

        @keyframes gridSlide {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }
    </style>
</head>
<body>
    <div class="universe">
        <!-- Background grid -->
        <div class="grid-overlay"></div>

        <!-- Integration mesh -->
        <svg class="integration-web" viewBox="0 0 1000 1000">
            <path class="mesh-line" d="M 200 300 L 500 200 L 800 300" />
            <path class="mesh-line" d="M 200 700 L 500 800 L 800 700" style="animation-delay: 2s;" />
            <path class="mesh-line" d="M 200 300 L 200 700" style="animation-delay: 4s;" />
            <path class="mesh-line" d="M 800 300 L 800 700" style="animation-delay: 6s;" />
            <path class="mesh-line" d="M 500 200 L 500 800" style="animation-delay: 8s;" />
        </svg>

        <!-- CI/CD rings -->
        <div class="ci-ring"></div>
        <div class="ci-ring"></div>
        <div class="ci-ring"></div>

        <!-- Energy field -->
        <div class="energy-field"></div>

        <!-- OSS Ecosystem nodes -->
        <div class="oss-ecosystem">
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
            <div class="oss-node"></div>
        </div>

        <!-- Central unified core -->
        <div class="unified-core">
            <div class="core-mesh"></div>
        </div>

        <!-- Data pipelines -->
        <div class="pipeline" style="--rotation: -30deg;"></div>
        <div class="pipeline" style="--rotation: 30deg;"></div>
        <div class="pipeline" style="--rotation: 90deg;"></div>

        <!-- Automation flow paths -->
        <svg class="automation-path" viewBox="0 0 1000 1000">
            <defs>
                <path id="flow1" d="M 500 250 Q 750 500 500 750 T 500 250" />
                <path id="flow2" d="M 250 500 Q 500 250 750 500 T 250 500" />
            </defs>
            
            <circle class="flow-particle">
                <animateMotion dur="8s" repeatCount="indefinite">
                    <mpath href="#flow1" />
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" />
            </circle>
            
            <circle class="flow-particle">
                <animateMotion dur="8s" begin="2s" repeatCount="indefinite">
                    <mpath href="#flow1" />
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" dur="8s" begin="2s" repeatCount="indefinite" />
            </circle>
            
            <circle class="flow-particle">
                <animateMotion dur="10s" repeatCount="indefinite">
                    <mpath href="#flow2" />
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" dur="10s" repeatCount="indefinite" />
            </circle>
            
            <circle class="flow-particle">
                <animateMotion dur="10s" begin="3s" repeatCount="indefinite">
                    <mpath href="#flow2" />
                </animateMotion>
                <animate attributeName="opacity" values="0;1;1;0" dur="10s" begin="3s" repeatCount="indefinite" />
            </circle>
        </svg>

        <!-- Next-gen standard beacons -->
        <div class="standard-beacon">
            <div class="beacon-core"></div>
        </div>
        <div class="standard-beacon">
            <div class="beacon-core"></div>
        </div>
        <div class="standard-beacon">
            <div class="beacon-core"></div>
        </div>
        <div class="standard-beacon">
            <div class="beacon-core"></div>
        </div>
    </div>

    <script>
        // Generate quantum dots
        for (let i = 0; i < 20; i++) {
            const dot = document.createElement('div');
            dot.className = 'quantum-dot';
            dot.style.left = (20 + Math.random() * 60) + '%';
            dot.style.top = (20 + Math.random() * 60) + '%';
            dot.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
            dot.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
            dot.style.animationDelay = Math.random() * 10 + 's';
            document.querySelector('.universe').appendChild(dot);
        }

        // Create connection lines between OSS nodes
        const nodes = document.querySelectorAll('.oss-node');
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.style.position = 'absolute';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        
        setInterval(() => {
            const node1 = nodes[Math.floor(Math.random() * nodes.length)];
            const node2 = nodes[Math.floor(Math.random() * nodes.length)];
            
            if (node1 !== node2) {
                const rect1 = node1.getBoundingClientRect();
                const rect2 = node2.getBoundingClientRect();
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', rect1.left + rect1.width / 2);
                line.setAttribute('y1', rect1.top + rect1.height / 2);
                line.setAttribute('x2', rect2.left + rect2.width / 2);
                line.setAttribute('y2', rect2.top + rect2.height / 2);
                line.setAttribute('stroke', 'rgba(52, 211, 153, 0.4)');
                line.setAttribute('stroke-width', '1');
                line.style.animation = 'fadeInOut 2s ease-in-out';
                
                svg.appendChild(line);
                setTimeout(() => line.remove(), 2000);
            }
        }, 1500);
        
        document.querySelector('.universe').appendChild(svg);

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0%, 100% { opacity: 0; }
                50% { opacity: 0.6; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
